<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Gestion Catégories</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


<!-- GLOBAL CONFIG -->
<script src="globalconfig.js"></script>
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
  <a class="navbar-brand fw-bold" href="#">📂 GESTION CATÉGORIES</a>

  <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
    ☰
  </button>

  <div class="collapse navbar-collapse" id="menu">
    <div class="navbar-nav ms-auto">
      <a class="nav-link text-white" href="Menu.html">Retour →</a>
    </div>
  </div>
</nav>

<div class="container py-3 py-md-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6">
      <div class="card shadow-sm p-3">

        <h5 class="mb-3 text-center text-md-start">Ajouter une catégorie</h5>

        <form onsubmit="ajouter(event)">
          <div class="input-group mb-3">
            <input 
              type="text" 
              class="form-control" 
              id="categoryInput" 
              placeholder="Nom de la catégorie..." 
              required
            >
            <button class="btn btn-primary">Ajouter</button>
          </div>
        </form>

        <hr>

        <h5 class="text-center text-md-start">Liste des catégories</h5>
        <ul class="list-group" id="categoryList"></ul>

      </div>
    </div>
  </div>
</div>

<script>

// 🔐 Vérifier idEntreprise au chargement
function verifierEntreprise() {
  let idEntreprise = localStorage.getItem("idEntreprise");

  if (!idEntreprise) {
    alert("Erreur : aucune entreprise détectée !");
    window.location.href = "login.html"; // ou page d'accueil
  }

  return idEntreprise;
}

// ➕ Ajouter catégorie
async function ajouter(event) {
  event.preventDefault();

  let idEntreprise = verifierEntreprise();

  let input = document.getElementById("categoryInput");
  let nom = input.value.trim();

  if (!nom) return;

  await fetch(`${API}/categorie`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ nom, idEntreprise }) // ✅ corrigé
  });

  input.value = "";
  charger();
}

// ❌ Supprimer
async function supprimer(id) {
  let idEntreprise = localStorage.getItem("idEntreprise");

  const confirmation = confirm("Voulez-vous vraiment supprimer ?");
  if (!confirmation) return;

  await fetch(`${API}/categorie/${id}?idEntreprise=${idEntreprise}`, {
    method: "DELETE"
  });

  charger();
}
// 📥 Charger catégories (FILTRÉ)
async function charger() {
  let idEntreprise = verifierEntreprise();

  let res = await fetch(`${API}/categorie?idEntreprise=` + idEntreprise);
  let data = await res.json();

  let list = document.getElementById("categoryList");
  list.innerHTML = "";

  data.forEach(cat => {
    list.innerHTML += `
      <li class="list-group-item d-flex justify-content-between align-items-center flex-wrap gap-2">
        
        <span>${cat.nom}</span>

        <button class="btn btn-danger btn-sm"
          onclick="supprimer('${cat._id}')">
          ❌ Supprimer
        </button>

      </li>
    `;
  });
}

// 🚀 démarrage
charger();

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
