<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Gestion Catégories</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


<!-- GLOBAL CONFIG -->
<script src="globalconfig.js"></script>


<style>
    body.loading {
      display: none;
    }
  </style>


</head>

<body class="bg-light loading">
  <div id="app">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
  <a class="navbar-brand fw-bold" href="#">📂 GESTION CATÉGORIES</a>

  <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
    ☰
  </button>

  <div class="collapse navbar-collapse" id="menu">
    <div class="navbar-nav ms-auto">
      <a class="nav-link text-white" href="Configuration.html">Retour →</a>
    </div>
  </div>
</nav>

<div class="container py-3 py-md-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6">
      <div class="card shadow-sm p-3">

        <h5 class="mb-3 text-center text-md-start">Ajouter une catégorie</h5>

        <form onsubmit="ajouter(event)">
          <div class="input-group mb-3">
            <input 
              type="text" 
              class="form-control" 
              id="categoryInput" 
              placeholder="Nom de la catégorie..." 
              required
            >
            <button class="btn btn-primary">Ajouter</button>
          </div>
        </form>

        <hr>


<div class="d-flex justify-content-end mb-3">
  <button class="btn btn-success" onclick="exportExcel()">
    📊 Exporter Excel
  </button>
</div>




        <h5 class="text-center text-md-start">Liste des catégories</h5>
        <ul class="list-group" id="categoryList"></ul>

      </div>
    </div>
  </div>
</div>

<script>

// ============================
// PROTECTION DE LA PAGE
// ============================
if (typeof API === "undefined" || !API) {
  window.location.replace("Login.html");
} else {
  (async () => {
    try {
      const res = await fetch(`${API}/me`, {
        credentials: "include",
        cache: "no-store"
      });

      // Session invalide ou expirée
      if (!res.ok) {
        window.location.replace("Login.html");
        return;
      }

      const data = await res.json();

      // Aucun utilisateur connecté
      if (!data.user) {
        window.location.replace("Login.html");
        return;
      }

      // Autorisé → afficher la page
document.body.classList.remove("loading");
    } catch (err) {
      // Erreur réseau ou API inaccessible
      window.location.replace("Login.html");
    }
  })();
}










// 🔐 Vérifier idEntreprise au chargement
function verifierEntreprise() {
  let idEntreprise = localStorage.getItem("idEntreprise");

  if (!idEntreprise) {
    alert("Erreur : aucune entreprise détectée !");
    window.location.href = "Login.html"; // ou page d'accueil
  }

  return idEntreprise;
}

// ➕ Ajouter catégorie
async function ajouter(event) {
  event.preventDefault();

  let idEntreprise = verifierEntreprise();

  let input = document.getElementById("categoryInput");
  let nom = input.value.trim();

  if (!nom) return;

  await fetch(`${API}/categorie`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ nom, idEntreprise }) // ✅ corrigé
  });

  input.value = "";
  charger();
}

// ❌ Supprimer
async function supprimer(id) {
  let idEntreprise = localStorage.getItem("idEntreprise");

  const confirmation = confirm("Voulez-vous vraiment supprimer ?");
  if (!confirmation) return;

  await fetch(`${API}/categorie/${id}?idEntreprise=${idEntreprise}`, {
    method: "DELETE"
  });

  charger();
}
// 📥 Charger catégories (FILTRÉ)
async function charger() {
  let idEntreprise = verifierEntreprise();

  let res = await fetch(`${API}/categorie?idEntreprise=` + idEntreprise);
  let data = await res.json();

  let list = document.getElementById("categoryList");
  list.innerHTML = "";

  data.forEach(cat => {
    list.innerHTML += `
      <li class="list-group-item d-flex justify-content-between align-items-center flex-wrap gap-2">
        
        <span>${cat.nom}</span>

        <button class="btn btn-danger btn-sm"
          onclick="supprimer('${cat._id}')">
          ❌ Supprimer
        </button>

      </li>
    `;
  });
}

// 🚀 démarrage
charger();








// 📊 Export Excel
function exportExcel() {

  let idEntreprise = verifierEntreprise();

  // Préparer les données
  const data = [];

  document.querySelectorAll("#categoryList li span").forEach((span, index) => {
    data.push({
      "N°": index + 1,
      "Catégorie": span.innerText,
      "Entreprise": idEntreprise
    });
  });

  // Créer le classeur Excel
  const wb = XLSX.utils.book_new();

  // Créer la feuille
  const ws = XLSX.utils.json_to_sheet(data);

  // Ajouter la feuille au classeur
  XLSX.utils.book_append_sheet(wb, ws, "Categories");

  // Nom du fichier avec date
  const date = new Date().toISOString().slice(0, 10);

  // Télécharger le fichier
  XLSX.writeFile(wb, `Categories_${idEntreprise}_${date}.xlsx`);
}












</script>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
