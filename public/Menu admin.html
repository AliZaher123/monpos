<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Menu Admin</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="globalconfig.js"></script>

</head>

<body class="bg-light">

<!-- TOP BAR -->
<nav class="navbar navbar-dark bg-dark px-3">
  <span class="navbar-brand fw-bold">🛒 HELPSTORE POS</span>
  <button class="btn btn-danger btn-sm" onclick="logoutAdmin()">Déconnexion</button>
</nav>

<div class="container py-4">

<!-- TITLE -->
<div class="text-center mb-4">
  <h3>Menu principal</h3>
  <p class="text-muted">Choisissez une section</p>
</div>

<!-- MENU GRID (2 PAR LIGNE) -->
<div class="row row-cols-2 g-3">

<!-- POS -->
<div class="col">
  <div class="card shadow-sm text-center p-3 h-100">
    <div class="fs-1">🛒</div>
    <h6>Entreprises</h6>
    <button class="btn btn-primary w-100 mt-2" onclick="go('Entreprise.html')">
      Ouvrir
    </button>
  </div>
</div>

<!-- STOCK -->
<div class="col">
  <div class="card shadow-sm text-center p-3 h-100">
    <div class="fs-1">📦</div>
    <h6>Configuration Ticket</h6>
    <button class="btn btn-success w-100 mt-2" onclick="go('ConfTicket.html')">
      Gérer
    </button>
  </div>
</div>





</div>

</div>

<script>

// navigation
function go(page) {
    window.location.href = page;
}



async function logoutAdmin() {
  try {
    const res = await fetch(`${API}/api/logout-admin`, {
      method: "POST",
      credentials: "include" // IMPORTANT
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.msg || "Erreur logout");
    }

    // 🧹 nettoyer le frontend
    localStorage.removeItem("adminLogged");
    localStorage.removeItem("adminUser");
    localStorage.removeItem("adminEntrepriseId");
    localStorage.removeItem("adminRole");

    // 🔁 redirection login
    window.location.href = "Login admin.html";

  } catch (err) {
    console.error("Logout error:", err);
    alert("Erreur de déconnexion");
  }
}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
