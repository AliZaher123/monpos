<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Taux Devise & TVA</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- GLOBAL CONFIG -->
<script src="globalconfig.js"></script>
</head>

<body class="bg-light" id="app" style="display:none;">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
  <a class="navbar-brand fw-bold" href="#">💱 TAUX & TVA</a>

  <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
    ☰
  </button>

  <div class="collapse navbar-collapse" id="menu">
    <div class="navbar-nav ms-auto">
      <a class="nav-link text-white" href="Configuration.html">Retour →</a>
    </div>
  </div>
</nav>

<div class="container py-3 py-md-4">

<div class="row g-3">

<!-- 💱 TAUX DEVISE -->
<div class="col-12 col-md-6">
<div class="card p-3 shadow-sm">

<h5>💱 Taux de devise (USD → CDF)</h5>

<div class="input-group mb-3">
  <input type="number" id="rateInput" class="form-control" placeholder="Ex: 2800">
  <button class="btn btn-primary" onclick="saveRate()">Enregistrer</button>
</div>

<h6 class="text-muted">Taux actuel :</h6>
<h3 class="text-primary" id="currentRate">0 FC</h3>

</div>
</div>

<!-- 📊 TVA -->
<div class="col-12 col-md-6">
<div class="card p-3 shadow-sm">

<h5>📊 TVA</h5>

<div class="input-group mb-3">
  <input type="number" id="tvaInput" class="form-control" placeholder="Ex: 18">
  <button class="btn btn-success" onclick="addTVA()">Ajouter</button>
</div>

<ul class="list-group" id="tvaList"></ul>

</div>
</div>

</div>
</div>

<script>



// ============================
// PROTECTION DE LA PAGE
// ============================
if (typeof API === "undefined" || !API) {
  window.location.replace("Login.html");
} else {
  (async () => {
    try {
      const res = await fetch(`${API}/me`, {
        credentials: "include",
        cache: "no-store"
      });

      // Session invalide ou expirée
      if (!res.ok) {
        window.location.replace("Login.html");
        return;
      }

      const data = await res.json();

      // Aucun utilisateur connecté
      if (!data.user) {
        window.location.replace("Login.html");
        return;
      }

      // Autorisé → afficher la page
      document.getElementById("app").style.display = "block";

    } catch (err) {
      // Erreur réseau ou API inaccessible
      window.location.replace("Login.html");
    }
  })();
}














// 🔐 ENTREPRISE SAAS
let idEntreprise = localStorage.getItem("idEntreprise");

if (!idEntreprise) {
    alert("Aucune entreprise détectée !");
    window.location.href = "Login.html";
}

// =======================
// 💱 TAUX DEVISE
// =======================

async function loadRate() {

    let res = await fetch(`${API}/taux?idEntreprise=` + idEntreprise);
    let data = await res.json();

    let rate = data?.usd_cdf || 2800;

    document.getElementById("currentRate").innerText = rate + " FC";
}

async function saveRate() {

    let value = parseFloat(document.getElementById("rateInput").value);

    if (!value || value <= 0) return;

    await fetch(`${API}/taux`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            usd_cdf: value,
            idEntreprise: idEntreprise
        })
    });

    loadRate();
}

// =======================
// 📊 TVA SAAS
// =======================

let tvaList = [];

async function loadTVA() {

    let res = await fetch(`${API}/tva?idEntreprise=` + idEntreprise);
    let data = await res.json();

    tvaList = data;
    renderTVA();
}

async function addTVA() {

    let value = parseFloat(document.getElementById("tvaInput").value);

    if (isNaN(value)) return;

    await fetch(`${API}/tva`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            valeur: value,
            idEntreprise: idEntreprise
        })
    });

    document.getElementById("tvaInput").value = "";

    loadTVA();
}

async function deleteTVA(id) {

    const confirmation = confirm("Voulez-vous supprimer ce taux ?");
    if (!confirmation) return;

    await fetch(`${API}/tva/` + id + "?idEntreprise=" + idEntreprise, {
        method: "DELETE"
    });

    loadTVA();
}

function renderTVA() {

    let list = document.getElementById("tvaList");
    list.innerHTML = "";

    tvaList.forEach(tva => {

        list.innerHTML += `
        <li class="list-group-item d-flex justify-content-between align-items-center">
            ${tva.valeur} %

            <button class="btn btn-danger btn-sm"
            onclick="deleteTVA('${tva._id}')">
                Supprimer
            </button>
        </li>
        `;
    });
}

// =======================
// 🚀 INIT
// =======================

loadRate();
loadTVA();

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
