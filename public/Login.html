<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Login POS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- GLOBAL CONFIG -->
<script src="globalconfig.js"></script>
</head>

<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">

  <div class="card p-4 shadow" style="width:350px">


<div class="text-center mb-3">
  
  <h1 class="fw-bold" style="font-size:32px; letter-spacing:3px; color:#0d6efd;">
    🛒 HELPSTORE
  </h1>
  <small class="text-muted">Point of Sale System</small>
</div>



    <h4 class="text-center mb-3">Connexion</h4>

    <input id="entrepriseId" class="form-control mb-2" placeholder="ID Entreprise">
    <input id="user" class="form-control mb-2" placeholder="User">
    <input id="password" type="password" class="form-control mb-3" placeholder="Password">

    <button class="btn btn-primary w-100" onclick="login()">Login</button>

    <div id="msg" class="mt-3 text-center"></div>

  </div>

</div>

<script>

const APILogin = `${API}`;

// =========================
// LOGIN
// =========================
async function login() {

  const entrepriseId = document.getElementById("entrepriseId").value.trim();
  const user = document.getElementById("user").value.trim();
  const password = document.getElementById("password").value.trim();

  const msg = document.getElementById("msg");

  if (!entrepriseId || !user || !password) {
    msg.innerHTML = "<span class='text-danger'>Remplis tous les champs</span>";
    return;
  }

  try {

    const res = await fetch(`${APILogin}/login`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ entrepriseId, user, password })
    });

    const data = await res.json();

    if (!res.ok) {
      msg.innerHTML = `<span class="text-danger">${data.msg}</span>`;
      return;
    }

    // =========================
    // SESSION
    // =========================
    localStorage.setItem("idEntreprise", data.entrepriseId);
    localStorage.setItem("user", data.user);
    localStorage.setItem("role", data.role);
    localStorage.setItem("isLoggedIn", "true");

    msg.innerHTML = "<span class='text-success'>Connexion réussie ✔</span>";

    // =========================
    // REDIRECTION SELON ROLE
    // =========================
    setTimeout(() => {

      if (data.role === "admin") {
        window.location.href = "Menu.html";
      } else {
        window.location.href = "index.html";
      }

    }, 800);

  } catch (err) {
    console.error(err);
    msg.innerHTML = "<span class='text-danger'>Erreur serveur</span>";
  }
}

</script>

</body>
</html>
