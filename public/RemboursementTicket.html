<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remboursement Tickets</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- CONFIG GLOBAL -->
<script src="globalconfig.js"></script>
</head>

<body class="bg-light">

<div class="container py-4">

    <h3 class="mb-4">💳 Remboursement des Tickets</h3>

    <!-- ===================================== -->
    <!-- 🔍 FILTRE PAR DATE -->
    <!-- ===================================== -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row g-3 align-items-end">

                <!-- Date début -->
                <div class="col-md-4">
                    <label class="form-label">Date début</label>
                    <input type="date" class="form-control" id="dateDebut">
                </div>

                <!-- Date fin -->
                <div class="col-md-4">
                    <label class="form-label">Date fin</label>
                    <input type="date" class="form-control" id="dateFin">
                </div>

                <!-- Bouton afficher -->
                <div class="col-md-4 d-grid">
                    <button class="btn btn-primary" onclick="filtrerRemboursements()">
                        Afficher
                    </button>
                </div>

            </div>
        </div>
    </div>

    <div class="row g-3">

        <!-- VENTES -->
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    Tickets vendus
                </div>
                <div class="card-body p-0" id="ticketList">
                    <div class="p-3 text-center text-muted">Chargement...</div>
                </div>
            </div>
        </div>

        <!-- REMBOURSEMENTS -->
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-danger text-white">
                    Tickets remboursés
                </div>
                <div class="card-body p-0" id="refundList">
                    <div class="p-3 text-center text-muted">Chargement...</div>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
// =========================
// 📦 API
// =========================
const API_VENTES = `${API}/ventes`;
const API_REMBOURSEMENT = `${API}/api/remboursement`;

// =========================
// 🔁 LOAD VENTES
// =========================
async function loadVentes() {
    try {

        const idEntreprise = localStorage.getItem("idEntreprise");

        const res = await fetch(`${API_VENTES}?idEntreprise=${idEntreprise}`, {
            credentials: "include"
        });

        const data = await res.json();
        renderVentes(data);

    } catch (err) {
        console.log("❌ ventes error:", err);
        document.getElementById("ticketList").innerHTML =
            `<div class="p-3 text-danger text-center">Erreur chargement ventes</div>`;
    }
}

// =========================
// 🔁 LOAD REMBOURSEMENTS
// =========================
async function loadRemboursements(dateDebut = "", dateFin = "") {
    try {

        const idEntreprise = localStorage.getItem("idEntreprise");

        const params = new URLSearchParams({
            idEntreprise
        });

        if (dateDebut) {
            params.append("dateDebut", dateDebut);
        }

        if (dateFin) {
            params.append("dateFin", dateFin);
        }

        const res = await fetch(
            `${API_REMBOURSEMENT}?${params.toString()}`,
            {
                credentials: "include"
            }
        );

        const data = await res.json();
        renderRefunds(data);

    } catch (err) {
        console.log("❌ remboursements error:", err);

        document.getElementById("refundList").innerHTML =
            `<div class="p-3 text-danger text-center">Erreur chargement remboursements</div>`;
    }
}

// =========================
// 🔍 FILTRER REMBOURSEMENTS
// =========================
function filtrerRemboursements() {
    const dateDebut = document.getElementById("dateDebut").value;
    const dateFin = document.getElementById("dateFin").value;

    loadRemboursements(dateDebut, dateFin);
}

// =========================
// 🧾 VENTES UI
// =========================
function renderVentes(ventes) {
    const container = document.getElementById("ticketList");
    container.innerHTML = "";

    if (!ventes || ventes.length === 0) {
        container.innerHTML =
            `<div class="p-3 text-muted text-center">Aucune vente</div>`;
        return;
    }

    ventes.forEach(v => {

        let produitsHTML = "";

        if (v.produits && Array.isArray(v.produits)) {
            v.produits.forEach(p => {
                produitsHTML += `
                    <li class="small">
                        ${p.nom} - ${p.quantite} x ${p.prix} $ = ${p.total} $
                    </li>
                `;
            });
        }

        container.innerHTML += `
        <div class="border-bottom p-3">

            <div class="mb-2">
                <strong>Ticket</strong><br>

                <small class="text-muted">
                    Date: ${new Date(v.date).toLocaleString()}
                </small><br>

                <small class="text-muted">
                    Paiement: ${v.paiement || "cash"}
                </small>
            </div>

            <ul class="mb-2">
                ${produitsHTML}
            </ul>

            <div class="d-flex justify-content-between align-items-center">
                <strong>Total: ${v.totalGeneral} $</strong>

                <button
                    class="btn btn-sm btn-danger"
                    onclick="refundTicket('${v._id}')">
                    Rembourser
                </button>
            </div>

        </div>
        `;
    });
}

// =========================
// 💸 REMBOURSEMENT
// =========================
async function refundTicket(id) {
    try {

        const res = await fetch(`${API_REMBOURSEMENT}/${id}`, {
            method: "POST",
            credentials: "include",
            headers: {
                "Content-Type": "application/json"
            }
        });

        const data = await res.json();

        if (!res.ok) {
            alert(data.message || "Erreur remboursement");
            return;
        }

        alert("✅ Remboursement effectué");

        // Recharger les listes
        loadVentes();
        filtrerRemboursements();

    } catch (err) {
        console.log("❌ refund error:", err);
        alert("Erreur lors du remboursement");
    }
}

// =========================
// 📉 REMBOURSEMENTS UI
// =========================
function renderRefunds(refunds) {
    const container = document.getElementById("refundList");
    container.innerHTML = "";

    if (!refunds || refunds.length === 0) {
        container.innerHTML =
            `<div class="p-3 text-muted text-center">Aucun remboursement</div>`;
        return;
    }

    refunds.forEach(r => {

        let produitsHTML = "";

        if (r.produits && Array.isArray(r.produits)) {
            r.produits.forEach(p => {
                produitsHTML += `
                    <li class="small">
                        ${p.nom} - ${p.quantite} x ${p.prix} $ = ${p.total} $
                    </li>
                `;
            });
        }

        container.innerHTML += `
        <div class="border-bottom p-3">

            <div class="mb-2">
                <strong>Ticket remboursé</strong><br>

                <small class="text-muted">
                    Date: ${new Date(r.date).toLocaleString()}
                </small>
            </div>

            <ul class="mb-2">
                ${produitsHTML}
            </ul>

            <div class="d-flex justify-content-between align-items-center">
                <strong>Total: ${r.totalGeneral} $</strong>
                <span class="badge bg-danger">Remboursé</span>
            </div>

        </div>
        `;
    });
}

// =========================
// 🚀 INIT
// =========================
loadVentes();
loadRemboursements();
</script>

</body>
</html>
