<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remboursement Tickets</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

    <h3 class="mb-4">💳 Remboursement des Tickets</h3>

    <div class="row g-3">

        <!-- Tickets vendus -->
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    Tickets vendus
                </div>
                <div class="card-body p-0" id="ticketList"></div>
            </div>
        </div>

        <!-- Tickets remboursés -->
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-danger text-white">
                    Tickets remboursés
                </div>
                <div class="card-body p-0" id="refundList"></div>
            </div>
        </div>

    </div>
</div>

<script>
// 📦 données test (remplace par MongoDB plus tard)
let tickets = [
    { id: 1, produit: "Pain", prix: 500 },
    { id: 2, produit: "Lait", prix: 1200 },
    { id: 3, produit: "Sucre", prix: 800 }
];

let refunded = [];

// 🔁 afficher tickets vendus
function renderTickets() {
    const container = document.getElementById("ticketList");
    container.innerHTML = "";

    tickets.forEach(t => {
        container.innerHTML += `
        <div class="d-flex justify-content-between align-items-center p-3 border-bottom">
            <div>
                <strong>${t.produit}</strong><br>
                <small class="text-muted">${t.prix} FC</small>
            </div>
            <button class="btn btn-sm btn-danger" onclick="refund(${t.id})">
                Rembourser
            </button>
        </div>
        `;
    });
}

// 🔁 afficher tickets remboursés
function renderRefunds() {
    const container = document.getElementById("refundList");
    container.innerHTML = "";

    refunded.forEach(t => {
        container.innerHTML += `
        <div class="d-flex justify-content-between align-items-center p-3 border-bottom">
            <div>
                <strong>${t.produit}</strong><br>
                <small class="text-muted">${t.prix} FC</small>
            </div>
            <span class="badge bg-danger">Remboursé</span>
        </div>
        `;
    });
}

// 💸 action remboursement
function refund(id) {
    const index = tickets.findIndex(t => t.id === id);

    if (index !== -1) {
        const ticket = tickets.splice(index, 1)[0];
        refunded.push(ticket);

        renderTickets();
        renderRefunds();
    }
}

// 🚀 init
renderTickets();
renderRefunds();
</script>

</body>
</html>
