<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remboursement Tickets</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

    <h3 class="mb-4">💳 Remboursement des Tickets</h3>

    <div class="row g-3">

        <!-- VENTES -->
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    Tickets vendus
                </div>
                <div class="card-body p-0" id="ticketList">
                    <div class="p-3 text-center text-muted">Chargement...</div>
                </div>
            </div>
        </div>

        <!-- REMBOURSEMENTS -->
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-danger text-white">
                    Tickets remboursés
                </div>
                <div class="card-body p-0" id="refundList">
                    <div class="p-3 text-center text-muted">Chargement...</div>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
// =========================
// 🔥 CONFIG API (Render)
// =========================
const API_VENTES = "/ventes";
const API_REMBOURSEMENT = "/api/remboursement";

// =========================
// 📦 LOAD VENTES
// =========================
async function loadVentes() {
    try {
        const res = await fetch(API_VENTES);
        const data = await res.json();

        renderVentes(data);

    } catch (err) {
        console.log("❌ erreur ventes:", err);
    }
}

// =========================
// 📦 LOAD REMBOURSEMENTS
// =========================
async function loadRemboursements() {
    try {
        const res = await fetch(API_REMBOURSEMENT);
        const data = await res.json();

        renderRefunds(data);

    } catch (err) {
        console.log("❌ erreur remboursements:", err);
    }
}

// =========================
// 🧾 AFFICHER VENTES
// =========================
function renderVentes(ventes) {
    const container = document.getElementById("ticketList");
    container.innerHTML = "";

    if (!ventes.length) {
        container.innerHTML = `<div class="p-3 text-muted text-center">Aucune vente</div>`;
        return;
    }

    ventes.forEach(v => {
        container.innerHTML += `
        <div class="d-flex justify-content-between align-items-center p-3 border-bottom">
            <div>
                <strong>Ticket</strong><br>
                <small class="text-muted">${v.totalGeneral} FC</small>
            </div>

            <button class="btn btn-sm btn-danger"
                onclick="refundTicket('${v._id}')">
                Rembourser
            </button>
        </div>
        `;
    });
}

// =========================
// 💸 REMBOURSER
// =========================
async function refundTicket(id) {
    try {

        const res = await fetch(`${API_REMBOURSEMENT}/${id}`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            }
        });

        const data = await res.json();

        if (!res.ok) {
            alert(data.message || "Erreur remboursement");
            return;
        }

        alert("✅ Remboursement effectué");

        loadVentes();
        loadRemboursements();

    } catch (err) {
        console.log("❌ erreur refund:", err);
    }
}

// =========================
// 📉 AFFICHER REMBOURSEMENTS
// =========================
function renderRefunds(refunds) {
    const container = document.getElementById("refundList");
    container.innerHTML = "";

    if (!refunds.length) {
        container.innerHTML = `<div class="p-3 text-muted text-center">Aucun remboursement</div>`;
        return;
    }

    refunds.forEach(r => {
        container.innerHTML += `
        <div class="d-flex justify-content-between align-items-center p-3 border-bottom">
            <div>
                <strong>Ticket</strong><br>
                <small class="text-muted">${r.totalGeneral} FC</small>
            </div>

            <span class="badge bg-danger">Remboursé</span>
        </div>
        `;
    });
}

// =========================
// 🚀 INIT
// =========================
loadVentes();
loadRemboursements();
</script>

</body>
</html>
