<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Menu POS</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- CONFIG GLOBAL -->
<script src="globalconfig.js"></script>
</head>

<body class="bg-light" id="app" style="display:none;">

<!-- 🔐 PROTECTION PAGE -->
<script>
if (!localStorage.getItem("user")) {
  window.location.href = "Login.html";
}
</script>




<!-- TOP BAR -->
<nav class="navbar navbar-dark bg-dark px-3">
  <span class="navbar-brand fw-bold">🛒 HELPSTORE POS</span>

  <div class="d-flex align-items-center gap-2">
    <span id="userText" class="text-white"></span>
    <button class="btn btn-danger btn-sm" onclick="logout()">Déconnexion</button>
  </div>
</nav>

<div class="container py-4">

<!-- TITLE -->
<div class="text-center mb-4">
  <h3>Menu principal</h3>
  <p class="text-muted">Choisissez une section</p>
</div>

<!-- MENU GRID -->
<div class="row row-cols-2 g-3">

  <div class="col">
    <div class="card shadow-sm text-center p-3 h-100">
      <div class="fs-1">🛒</div>
      <h6>POS</h6>
      <button class="btn btn-primary w-100 mt-2" onclick="go('Index.html')">
        Ouvrir
      </button>
    </div>
  </div>

  <div class="col">
    <div class="card shadow-sm text-center p-3 h-100">
      <div class="fs-1">📦</div>
      <h6>Stock</h6>
      <button class="btn btn-success w-100 mt-2" onclick="go('Stock.html')">
        Gérer
      </button>
    </div>
  </div>

  <div class="col">
    <div class="card shadow-sm text-center p-3 h-100">
      <div class="fs-1">⚙️</div>
      <h6>Configuration</h6>
      <button class="btn btn-warning w-100 mt-2" onclick="go('Configuration.html')">
        Ouvrir
      </button>
    </div>
  </div>

  <div class="col">
    <div class="card shadow-sm text-center p-3 h-100">
      <div class="fs-1">📊</div>
      <h6>Rapports</h6>
      <button class="btn btn-dark w-100 mt-2" onclick="go('Rapports.html')">
        Voir
      </button>
    </div>
  </div>

</div>

</div>

<script>





// =====================
// AFFICHAGE USER PROPRE
// =====================
document.addEventListener("DOMContentLoaded", () => {

  const user = localStorage.getItem("user") || "Inconnu";
  const role = localStorage.getItem("role") || "";

  document.getElementById("userText").innerText =
    "👤 " + user + (role ? " (" + role + ")" : "");
});

// =====================
// NAVIGATION
// =====================
function go(page) {
  window.location.href = page;
}

// =====================
// LOGOUT
// =====================
async function logout() {

  try {

    await fetch("/logout", {
      method: "POST",
      credentials: "include"
    });

    localStorage.clear();

    window.location.href = "Login.html";

  } catch (err) {

    console.log("Logout error:", err);

    // même si erreur serveur, on force logout local
    localStorage.clear();
    window.location.href = "Login.html";
  }
}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
