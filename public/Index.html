<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<!-- IMPORTANT POUR MOBILE -->
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>POS HelpStore</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- GLOBAL CONFIG -->
<script src="globalconfig.js"></script>
</head>

<body class="bg-light">

<!-- MENU RESPONSIVE -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">

  <a class="navbar-brand fw-bold" href="#">🛒 HELPSTORE</a>

  <!-- BOUTON MOBILE -->
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
    ☰
  </button>

  <div class="collapse navbar-collapse" id="menu">
    <div class="navbar-nav ms-auto">
      <a class="nav-link text-white" href="Rapports.html">Rapports</a>
      <a id="menuLink" class="nav-link text-white" href="Menu.html">Menu</a>
    </div>
 <!-- 👇 ICI -->
  <!--<span id="currentUser" class="text-white ms-3"></span>-->

  </div>
  <div class="d-flex align-items-center ms-auto gap-3">

  <span id="currentUser" class="text-white"></span>

  <button class="btn btn-danger btn-sm" onclick="logout()">
    Déconnexion
  </button>

</div>

</nav>

<div class="container py-3 py-md-4">

<h2 class="text-center mb-4">🛒 MON POS</h2>

<div class="row g-3">

<!-- LEFT -->
<div class="col-12 col-md-4">
<div class="card p-3 shadow-sm">

<h5>Recherche Produit</h5>

<div class="position-relative">

  <input 
    type="text" 
    id="search" 
    class="form-control mb-3"
    placeholder="🔍 Nom ou code barre..."
  >

  <ul 
    id="suggestions" 
    class="list-group position-absolute w-100 d-none"
  ></ul>

</div>

<hr>

<h5>Ajouter Produit</h5>

<input id="name" class="form-control my-2" placeholder="Nom produit">
<input id="price" type="number" class="form-control my-2" placeholder="Prix (USD)">
<input id="qty" type="number" class="form-control my-2" placeholder="Quantité">

<button class="btn btn-primary w-100 mt-2" onclick="addToCartFromForm()">Ajouter</button>

<hr>

<h6>Taux USD → CDF</h6>
<p class="fw-bold text-primary">
  1 USD = <span id="rateText">2800</span> FC
</p>

</div>
</div>

<!-- RIGHT -->
<div class="col-12 col-md-8">
<div class="card p-3 shadow-sm">

<!-- TABLE RESPONSIVE -->
<div class="table-responsive">
<table class="table table-bordered">
<thead>
<tr>
<th>Produit</th>
<th>Prix</th>
<th>Qté</th>
<th>Total</th>
<th>Action</th>
</tr>
</thead>

<tbody id="cart"></tbody>
</table>
</div>

<h6 class="text-end">TTC USD  : <span id="totalUSD">0</span> $</h6>
<h6 class="text-end">TTC CDF  : <span id="totalCDF">0</span> FC</h6>

<h6 class="text-end text-primary">TVA USD : <span id="tvaUSD">0</span> $</h6>
<h6 class="text-end text-success">TVA CDF : <span id="tvaCDF">0</span> FC</h6>

<button class="btn btn-success w-100 mt-2" onclick="openPayment()">💳 Payer</button>
<button class="btn btn-danger w-100 mt-2" onclick="clearCart()">Vider panier</button>

</div>
</div>

</div>
</div>

<!-- PAYMENT MODAL -->
<div class="modal fade" id="paymentModal">
<div class="modal-dialog modal-dialog-centered">
<div class="modal-content p-3">

<h5>💳 Paiement</h5>

<select id="paymentMethod" class="form-select my-2">
    <option value="Cash">Cash</option>
    <option value="Mobile Money">Mobile Money</option>
    <option value="Carte Bancaire">Carte Bancaire</option>
    <option value="Virement">Virement</option>
</select>

<input id="payUSD" type="number" class="form-control my-2" placeholder="Payé en USD">
<input id="payCDF" type="number" class="form-control my-2" placeholder="Payé en CDF">

<textarea id="remark" class="form-control my-2" placeholder="Remarque / note client"></textarea>

<button class="btn btn-primary w-100" onclick="pay()">Valider paiement</button>

<div id="receipt" class="mt-3"></div>

</div>
</div>
</div>

<script>





let idEntreprise = localStorage.getItem("idEntreprise");


document.addEventListener("DOMContentLoaded", () => {
  const user = localStorage.getItem("user") || "Inconnu";
  const role = localStorage.getItem("role") || "";

  const el = document.getElementById("currentUser");

  if (el) {
    el.innerText = "👤 " + user + (role ? " (" + role + ")" : "");
  }
});

//pour afficher le nom user dans le ticket
let user = localStorage.getItem("user") || "Inconnu";


// 🔐 sécurité SaaS
if (!idEntreprise) {
  alert("Aucune entreprise connectée !");
  window.location.href = "Login.html";
}

document.addEventListener("DOMContentLoaded", () => {

  const role = localStorage.getItem("role");

  if (role === "user") {
    const menuLink = document.getElementById("menuLink");

    if (menuLink) {
      menuLink.classList.add("disabled");
      menuLink.style.pointerEvents = "none";
      menuLink.style.opacity = "0.5";
    }
  }

});


function logout() {

    localStorage.clear(); // 🔥 supprime TOUT (session propre)

    window.location.href = "Login.html";
}















let settings = {
  headerText: "",
  footerText: "",
  logo: "",
  enableTVA: false
};


async function loadSettings() {
  try {
    let res = await fetch(`${API}/api/ticket/${idEntreprise}`);
    let data = await res.json();

    settings = {
  headerText: data.headerText || "",
  footerText: data.footerText || "",
  logo: data.logo || "",
  enableTVA: data.enableTVA || false
};
    console.log("ID ENTREPRISE:", idEntreprise);

  } catch (err) {
    console.error("Erreur settings:", err);
  }
}



















let cart = [];
let rate = 2800;

const APIStock = `${API}/stock`;
let data = [];

// ==========================
// 📥 PRODUITS
// ==========================
async function loadProducts() {
  try {
    let res = await fetch(APIStock + "?idEntreprise=" + idEntreprise);
    data = await res.json();
  } catch (err) {
    console.error(err);
  }
}

// ==========================
// 💱 TAUX
// ==========================
async function loadRate() {
  try {
    let res = await fetch(`${API}/taux?idEntreprise=` + idEntreprise);
    let d = await res.json();
    rate = d.usd_cdf || 2800;
  } catch (err) {
    console.error(err);
  }
}

// ==========================
// INIT
// ==========================
async function init() {
  await Promise.all([
    loadProducts(),
    loadRate(),
    loadSettings()
  ]);

  render();
}
init();

// ==========================
// ➕ AJOUT PANIER
// ==========================
function addToCart(id, name, price, tva = 0) {

  let found = cart.find(p => p.id === id);

  if (found) {
    found.qty++;
  } else {
    cart.push({
      id: id, // ✅ vrai ID MongoDB
      name,
      price,
      qty: 1,
      tva,
      idEntreprise
    });
  }

  render();
}

function addToCartFromForm() {

  const name = document.getElementById("name").value;
  const price = parseFloat(document.getElementById("price").value);
  const qty = parseInt(document.getElementById("qty").value);

  if (!name || !price || !qty) {
    alert("Remplis tous les champs !");
    return;
  }

cart.push({
  id: Date.now().toString(),
  name,
  price,
  qty,
  tva: 0,
  idEntreprise: idEntreprise
});
  render();
}













// ==========================
// 📊 CALCUL + AFFICHAGE
// ==========================
function render() {

  document.getElementById("rateText").innerText = rate;

  let tbody = document.getElementById("cart");
  tbody.innerHTML = "";

  let totalHT = 0;
  let totalTVA = 0;

  cart.forEach((p, i) => {

    let qty = p.qty;

    // 🔥 prix TTC unitaire
    let ttcUnit = p.price;

    // 🔥 HT = TTC / (1 + TVA%)
    let htUnit = ttcUnit / (1 + p.tva / 100);

    // 🔥 TVA = TTC - HT
    let tvaUnit = ttcUnit - htUnit;

    let lineHT = htUnit * qty;
    let lineTVA = tvaUnit * qty;
    let lineTTC = ttcUnit * qty;

    totalHT += lineHT;
    totalTVA += lineTVA;

    tbody.innerHTML += `
      <tr>
        <td>${p.name}</td>
        <td>${ttcUnit.toFixed(2)}</td>
        <td>
          <input type="number" value="${qty}"
            onchange="updateQty(${i}, this.value)"
            class="form-control">
        </td>
        <td>${lineTTC.toFixed(2)}</td>
        <td>
          <button class="btn btn-danger btn-sm"
            onclick="removeItem(${i})">X</button>
        </td>
      </tr>
    `;
  });

  // ==========================
  // 💰 TOTALS
  // ==========================

  let totalTTC_USD = totalHT + totalTVA;
  let totalTTC_CDF = totalTTC_USD * rate;

  let tvaCDF = totalTVA * rate;

  // ==========================
  // 📤 AFFICHAGE FINAL
  // ==========================

  document.getElementById("totalUSD").innerText = totalTTC_USD.toFixed(2);
  document.getElementById("totalCDF").innerText = totalTTC_CDF.toLocaleString();

  document.getElementById("tvaUSD").innerText = totalTVA.toFixed(2);
  document.getElementById("tvaCDF").innerText = tvaCDF.toLocaleString();
}


// ==========================
// UPDATE QTY
// ==========================
function updateQty(i, val) {
  cart[i].qty = parseInt(val) || 1;
  render();
}


// ==========================
// REMOVE
// ==========================
function removeItem(i) {
  cart.splice(i, 1);
  render();
}


// ==========================
// CLEAR
// ==========================
function clearCart() {
  cart = [];
  render();
}


// ==========================
// AUTOCOMPLETE
// ==========================
const input = document.getElementById("search");
const suggestions = document.getElementById("suggestions");

input.addEventListener("input", function () {

  const value = this.value.toLowerCase();
  suggestions.innerHTML = "";

  if (!value) {
    suggestions.classList.add("d-none");
    return;
  }

  const results = data
.filter(item => item.idEntreprise === idEntreprise)
.filter(item =>
  item.nom.toLowerCase().includes(value) ||
item.codebarre.toString().includes(value));

  results.forEach(item => {

    const li = document.createElement("li");
    li.classList.add("list-group-item");

    li.innerHTML = `
      <strong>${item.nom}</strong>
<small>(${item.prixTTC}$ | TVA ${item.tva}% | ${item.idEntreprise})</small>    `;

    li.onclick = () => {
      addToCart(item._id, item.nom, item.prixTTC, item.tva);
      input.value = "";
      suggestions.classList.add("d-none");
    };

    suggestions.appendChild(li);
  });

  suggestions.classList.remove("d-none");
});

document.addEventListener("click", (e) => {
  if (!e.target.closest(".position-relative")) {
    suggestions.classList.add("d-none");
  }
});

// ==========================
// 💳 PAYMENT
// ==========================
function openPayment() {
  new bootstrap.Modal(document.getElementById("paymentModal")).show();
}

async function pay() {

  let totalTTC = parseFloat(document.getElementById("totalUSD").innerText);
  let payUSD = parseFloat(document.getElementById("payUSD").value) || 0;
  let payCDF = parseFloat(document.getElementById("payCDF").value) || 0;
  let remark = document.getElementById("remark").value;

  let method = document.getElementById("paymentMethod").value;

  let payTotalUSD = payUSD + (payCDF / rate);

  if (payTotalUSD < totalTTC) {
    alert("Paiement insuffisant !");
    return;
  }

  let change = payTotalUSD - totalTTC;

  const produits = cart.map(p => ({
  idProduit: p.id,
  nom: p.name,
  prix: p.price,
  quantite: p.qty,
  total: p.price * p.qty
}));

// 🔥 calcul total
let totalGeneral = produits.reduce((sum, p) => sum + p.total, 0);

const res = await fetch(`${API}/ventes`, {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({
    produits: produits,
    totalGeneral: totalGeneral,
    paiement: method,
    idEntreprise: idEntreprise
  })
});

const data = await res.json();

if (!res.ok) {
  console.error(data);
  alert("Erreur enregistrement vente !");
  return;
}

console.log("Vente OK:", data);


let safePay = payTotalUSD || 0;
let safeChange = change || 0;

let ticket = `<div>`;

// ======================
// HEADER (CENTRE)
// ======================
ticket += `<div class="center">`;

if (settings.logo) {
  ticket += `<img src="${settings.logo}"><br>`;
}

if (settings.headerText) {
  ticket += `<p>${settings.headerText.replace(/\n/g, "<br>")}</p>`;
}

ticket += `</div>`;

// ======================
// BODY (GAUCHE)
// ======================
ticket += `<div class="left">`;

ticket += `<p>Caissier: ${user}</p>`;
//ticket += `<p>Entreprise: ${idEntreprise}</p>`;

const now = new Date().toLocaleString();
ticket += `<p>Date: ${now}</p>`;

ticket += `<hr>`;
// PRODUITS
cart.forEach(p => {
  ticket += `<p>${p.name} x${p.qty} = ${(p.price * p.qty).toFixed(2)} USD</p>`;
});

// TOTAL + TVA + PAIEMENT
ticket += `<hr>`;
// 🔥 CONVERSION
let totalCDF = totalTTC * rate;
let tvaUSD = parseFloat(document.getElementById("tvaUSD").innerText);
let tvaCDF = tvaUSD * rate;

// ======================
// TOTAL
// ======================
ticket += `
  <p><b>TOTAL: ${totalTTC.toFixed(2)} USD</b></p>
  <p><b>TOTAL: ${totalCDF.toLocaleString()} FC</b></p>
`;

// ======================
// TVA
// ======================
if (settings.enableTVA) {
  ticket += `
   <!-- <p>TVA: ${tvaUSD.toFixed(2)} USD</p> -->
    <p>TVA: ${tvaCDF.toLocaleString()} FC</p>
  `;
}

ticket += `<p>Payé: ${safePay.toFixed(2)} USD</p>`;
ticket += `<p>Monnaie: ${safeChange.toFixed(2)} USD</p>`;
ticket += `<p>Méthode: ${method}</p>`;

if (remark && remark.trim() !== "") {
  ticket += `<p><b>Remarque:</b> ${remark}</p>`;
}

ticket += `</div>`;

// ======================
// FOOTER (CENTRE)
// ======================
ticket += `<div class="center">`;

ticket += `<hr>`;

if (settings.footerText) {
  ticket += `<p>${settings.footerText.replace(/\n/g, "<br>")}</p>`;
}

ticket += `</div>`;

ticket += `</div>`;
  printTicket(ticket);
  // 🔥 retour direct vers page principale
setTimeout(() => {
  window.location.href = "Index.html";
}, 1500);
  clearCart();
}



// ==========================
// 🖨️ PRINT
// ==========================
function printTicket(html) {

  let w = window.open("", "_blank");

  w.document.open();

  w.document.write(`
    <html>
    <head>
      <title>Ticket</title>

      <style>
        body {
          font-family: monospace;
          margin: 0;
          padding: 10px;
        }

        .center {
          text-align: center;
        }

        .left {
          text-align: left;
        }

        img {
  width: 180px;
  max-width: 100%;
  height: auto;
  display: block;
  margin: auto;
}

        hr {
          border: none;
          border-top: 1px dashed #000;
          margin: 8px 0;
        }
      </style>

    </head>

    <body onload="window.print()">
      ${html}
    </body>
    </html>
  `);

  w.document.close();

  // 🔥 attendre chargement COMPLET (IMPORTANT pour logo base64)
  w.onload = function () {
    setTimeout(() => {
      w.focus();
      w.print();
      w.close();
    }, 300);
  };
}


</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
