<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Statistiques</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- GLOBAL CONFIG -->
<script src="globalconfig.js"></script>

</head>

<body class="bg-light" id="app" style="display:none;">


<!-- NAVBAR RESPONSIVE MOBILE -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm no-print">
  <div class="container-fluid">

    <a class="navbar-brand fw-bold" href="#">
      📊 Statistiques des ventes
    </a>

    <button class="navbar-toggler" type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarPOS"
      aria-controls="navbarPOS"
      aria-expanded="false"
      aria-label="Toggle navigation">

      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarPOS">
      <div class="ms-auto mt-3 mt-lg-0 d-flex flex-column flex-lg-row gap-2">

        <a class="btn btn-light btn-sm" href="Rapports.html">
          ← Retour
        </a>

      </div>
    </div>

  </div>
</nav>
    <div class="container py-4">

        <!-- HEADER -->

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2 class="fw-bold">
                📊 Statistiques des ventes
            </h2>

            <button class="btn btn-dark" onclick="chargerStatistiques()">
                Actualiser
            </button>

        </div>

        <!-- FILTRE -->

        <div class="card shadow-sm border-0 mb-4">

            <div class="card-body">

                <div class="row g-3">

                    <!-- DATE DEBUT -->

                    <div class="col-md-4">

                        <label class="form-label">
                            Date début
                        </label>

                        <input
                            type="date"
                            id="dateDebut"
                            class="form-control"
                        >

                    </div>

                    <!-- DATE FIN -->

                    <div class="col-md-4">

                        <label class="form-label">
                            Date fin
                        </label>

                        <input
                            type="date"
                            id="dateFin"
                            class="form-control"
                        >

                    </div>

                    <!-- BOUTON -->

                    <div class="col-md-4 d-flex align-items-end">

                        <button
                            class="btn btn-primary w-100"
                            onclick="chargerStatistiques()"
                        >

                            Rechercher

                        </button>

                    </div>

                </div>

            </div>

        </div>

        <!-- TABLEAUX -->

        <div class="row">

            <!-- TOP VENTES -->

            <div class="col-lg-6 mb-4">

                <div class="card shadow-sm border-0 h-100">

                    <div class="card-header bg-success text-white">

                        <h5 class="mb-0">
                            🔥 Articles les plus vendus
                        </h5>

                    </div>

                    <div class="card-body">

                        <div class="table-responsive">

                            <table class="table table-hover align-middle">

                                <thead>

                                    <tr>

                                        <th>#</th>
                                        <th>Article</th>
                                        <th>Quantité</th>
                                        <th>Total</th>

                                    </tr>

                                </thead>

                                <tbody id="topVentes">

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>

            </div>

            <!-- MOINS VENDUS -->

            <div class="col-lg-6 mb-4">

                <div class="card shadow-sm border-0 h-100">

                    <div class="card-header bg-danger text-white">

                        <h5 class="mb-0">
                            📉 Articles les moins vendus
                        </h5>

                    </div>

                    <div class="card-body">

                        <div class="table-responsive">

                            <table class="table table-hover align-middle">

                                <thead>

                                    <tr>

                                        <th>#</th>
                                        <th>Article</th>
                                        <th>Quantité</th>
                                        <th>Total</th>

                                    </tr>

                                </thead>

                                <tbody id="moinsVentes">

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>

// ============================
// PROTECTION DE LA PAGE
// ============================
if (typeof API === "undefined" || !API) {
  window.location.replace("Login.html");
} else {
  (async () => {
    try {
      const res = await fetch(`${API}/me`, {
        credentials: "include",
        cache: "no-store"
      });

      // Session invalide ou expirée
      if (!res.ok) {
        window.location.replace("Login.html");
        return;
      }

      const data = await res.json();

      // Aucun utilisateur connecté
      if (!data.user) {
        window.location.replace("Login.html");
        return;
      }

      // Autorisé → afficher la page
      document.getElementById("app").style.display = "block";

    } catch (err) {
      // Erreur réseau ou API inaccessible
      window.location.replace("Login.html");
    }
  })();
}






const idEntreprise = localStorage.getItem("idEntreprise");

// =========================
// CHARGER STATISTIQUES (UNIQUEMENT AU CLICK)
// =========================

async function chargerStatistiques() {

    const dateDebut = document.getElementById("dateDebut").value;
    const dateFin = document.getElementById("dateFin").value;

    // ❌ BLOQUER si dates vides
    if (!dateDebut || !dateFin) {
        alert("Veuillez sélectionner une date début et une date fin");
        return;
    }

    try {

        // TOP PRODUITS
        const topResponse = await fetch(
            `/ventes/top-produits?idEntreprise=${idEntreprise}&dateDebut=${dateDebut}&dateFin=${dateFin}`,
            { credentials: "include" }
        );

        const topData = await topResponse.json();

        const topContainer = document.getElementById("topVentes");
        topContainer.innerHTML = "";

        if (topData.length === 0) {
            topContainer.innerHTML = `
                <tr>
                    <td colspan="4" class="text-center text-muted">
                        Aucun résultat
                    </td>
                </tr>
            `;
        }

        topData.forEach((item, index) => {
            topContainer.innerHTML += `
                <tr>
                    <td>${index + 1}</td>
                    <td>${item._id}</td>
                    <td><span class="badge bg-success">${item.totalQuantite}</span></td>
                    <td>${item.totalVentes.toFixed(2)} $</td>
                </tr>
            `;
        });

        // MOINS VENDUS
        const moinsResponse = await fetch(
            `/ventes/moins-vendus?idEntreprise=${idEntreprise}&dateDebut=${dateDebut}&dateFin=${dateFin}`,
            { credentials: "include" }
        );

        const moinsData = await moinsResponse.json();

        const moinsContainer = document.getElementById("moinsVentes");
        moinsContainer.innerHTML = "";

        if (moinsData.length === 0) {
            moinsContainer.innerHTML = `
                <tr>
                    <td colspan="4" class="text-center text-muted">
                        Aucun résultat
                    </td>
                </tr>
            `;
        }

        moinsData.forEach((item, index) => {
            moinsContainer.innerHTML += `
                <tr>
                    <td>${index + 1}</td>
                    <td>${item._id}</td>
                    <td><span class="badge bg-danger">${item.totalQuantite}</span></td>
                    <td>${item.totalVentes.toFixed(2)} $</td>
                </tr>
            `;
        });

    } catch (error) {
        console.log(error);
        alert("Erreur lors du chargement");
    }
}



    </script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
