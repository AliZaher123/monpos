<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POS SaaS</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- GLOBAL CONFIG -->
<script src="globalconfig.js"></script>
</head>

<body class="bg-light">

<!-- MENU RESPONSIVE -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">

  <a class="navbar-brand fw-bold" href="#">🛒 HELPSTORE</a>

  <!-- BOUTON MOBILE -->
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
    ☰
  </button>

  <div class="collapse navbar-collapse" id="menu">
    <div class="navbar-nav ms-auto">
      <a class="nav-link text-white" href="Menu admin.html">Menu</a>
    </div>
 <!-- 👇 ICI -->
  <span id="currentUser" class="text-white ms-3"></span>

  </div>

</nav>





<div class="container py-4">

<h3 class="text-center mb-4">⚙️ Ticket SaaS Multi-Entreprise</h3>

<div class="row g-3">

<!-- CONFIG -->
<div class="col-md-6">
<div class="card p-3">

<h5>Entreprise</h5>

<input type="text" id="entrepriseInput" class="form-control my-2" placeholder="ID Entreprise (ex: ENT-001)">

<button onclick="setEntreprise()" class="btn btn-dark w-100 mb-3">🔑 Charger entreprise</button>

<h5>Paramètres Ticket</h5>

<input type="file" id="logoInput" class="form-control my-2">

<textarea id="headerText" class="form-control my-2" placeholder="HEADER"></textarea>
<textarea id="footerText" class="form-control my-2" placeholder="FOOTER"></textarea>

<div class="form-check my-2">
<input type="checkbox" id="enableTVA" class="form-check-input">
<label class="form-check-label">TVA</label>
</div>

<button onclick="saveSettings()" class="btn btn-primary w-100 my-1">💾 Sauvegarder</button>
<button onclick="loadSettings()" class="btn btn-warning w-100 my-1">✏️ Recharger</button>
<button onclick="deleteSettings()" class="btn btn-danger w-100 my-1">🗑 Supprimer</button>

</div>
</div>

<!-- PREVIEW -->
<div class="col-md-6">
<div class="card p-3">

<h5>Aperçu Ticket</h5>
<div id="preview" class="border p-3 bg-white text-center" style="font-family: monospace;"></div>

</div>
</div>

</div>
</div>

<script>

let idEntreprise = localStorage.getItem("idEntreprise");

// =======================
// SET ENTREPRISE
// =======================
function setEntreprise() {

  const id = entrepriseInput.value.trim();

  if (!id) {
    alert("Entre un ID entreprise !");
    return;
  }

  idEntreprise = id;
  localStorage.setItem("idEntreprise", id);

  loadSettings();
}

// =======================
// LOAD SETTINGS
// =======================
async function loadSettings() {

  if (!idEntreprise) return;

  try {

    const res = await fetch(`${API}/api/ticket/${idEntreprise}`);
    const data = await res.json();

    headerText.value = data.headerText || "";
    footerText.value = data.footerText || "";
    enableTVA.checked = data.enableTVA || false;

    if (data.logo) {
      localStorage.setItem("logo", data.logo);
    }

    updatePreview();

  } catch (err) {
    console.error(err);
  }
}

// =======================
// SAVE SETTINGS
// =======================
async function saveSettings() {

  if (!idEntreprise) {
    alert("ID entreprise manquant !");
    return;
  }

  const payload = {
    idEntreprise,
    headerText: headerText.value,
    footerText: footerText.value,
    logo: localStorage.getItem("logo"),
    enableTVA: enableTVA.checked
  };

  await fetch(`${API}/api/ticket/save`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  alert("Sauvegardé ✔");
}

// =======================
// DELETE SETTINGS
// =======================
async function deleteSettings() {

  if (!idEntreprise) return;

  if (!confirm("Supprimer ce ticket ?")) return;

  await fetch(`${API}/api/ticket/${idEntreprise}`, {
    method: "DELETE"
  });

  headerText.value = "";
  footerText.value = "";
  enableTVA.checked = false;
  localStorage.removeItem("logo");

  updatePreview();

  alert("Supprimé ✔");
}

// =======================
// LOGO UPLOAD
// =======================
logoInput.addEventListener("change", e => {

  const reader = new FileReader();

  reader.onload = () => {
    localStorage.setItem("logo", reader.result);
    updatePreview();
  };

  reader.readAsDataURL(e.target.files[0]);
});

// =======================
// PREVIEW
// =======================
function updatePreview() {

  let logo = localStorage.getItem("logo");

  let html = "";

  if (logo) {
html += `<img src="${logo}" style="max-width:180px; max-height:200px; object-fit:contain;"><br>`;
  }

  html += `<p>${headerText.value.replace(/\n/g,"<br>")}</p><hr>`;

  html += `
    <p>Produit A = 10 USD</p>
    <p>Produit B = 20 USD</p>
    <hr>
    <b>Total: 30 USD</b>
  `;

  if (enableTVA.checked) {
    html += `<p>TVA incluse</p>`;
  }

  html += `<hr><p>${footerText.value.replace(/\n/g,"<br>")}</p>`;

  preview.innerHTML = html;
}

// LIVE UPDATE
document.querySelectorAll("textarea").forEach(el => {
  el.addEventListener("input", updatePreview);
});

// INIT AUTO LOAD
window.onload = () => {

  if (idEntreprise) {
    entrepriseInput.value = idEntreprise;
    loadSettings();
  }
};

</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>
</html>
