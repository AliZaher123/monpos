<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rapport POS</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- GLOBAL CONFIG -->
<script src="globalconfig.js"></script>

<!-- 🔥 IMPRESSION CLEAN -->
<style>
@media print {

  nav,
  .navbar,
  .no-print,
  button,
  input,
  select {
    display: none !important;
  }

  body {
    background: white !important;
  }

  .card {
    border: none !important;
    box-shadow: none !important;
  }

  #printHeader {
    display: block !important;
  }
}
</style>

</head>

<body class="bg-light">

<!-- NAVBAR (NE S'IMPRIME PAS) -->
<nav class="navbar navbar-dark bg-dark px-3 no-print">
  <span class="navbar-brand fw-bold">📊 RAPPORT POS</span>
  <div>
      <a class="nav-link text-white" href="RemboursementTicket.html">Remboursement Ticket</a>
</div>

  <a class="btn btn-light" href="Index.html">Retour</a>
</nav>

<div class="container py-3">

<!-- HEADER IMPRESSION -->
<div id="printHeader" class="text-center mb-4 d-none">
  <h4 class="fw-bold">📊 RAPPORT DES VENTES</h4>
  <p class="mb-1" id="printEntreprise"></p>
  <p class="mb-1" id="printUser"></p>
  <p class="mb-1" id="printDate"></p>
  <hr class="border-dark">
</div>

<!-- FILTRES -->
<div class="card p-3 mb-3 no-print">
  <div class="row g-2 align-items-end">

    <div class="col-12 col-md-4">
      <label>Date début</label>
      <input type="date" id="dateDebut" class="form-control">
    </div>

    <div class="col-12 col-md-4">
      <label>Date fin</label>
      <input type="date" id="dateFin" class="form-control">
    </div>

    <div class="col-12 col-md-4 d-flex gap-2">
      <button class="btn btn-primary w-100" onclick="chargerRapport()">Afficher</button>
      <button class="btn btn-dark" onclick="printRapport()">🖨️ Imprimer</button>
    </div>

  </div>
</div>

<!-- CARDS -->
<div class="row g-3 mb-4">

  <div class="col-12 col-md-4">
    <div class="card border-success">
      <div class="card-body text-center">
        <h6>Total Ventes</h6>
        <h3 class="fw-bold text-success" id="totalSales">0 $</h3>
      </div>
    </div>
  </div>

  <div class="col-12 col-md-4">
    <div class="card border-primary">
      <div class="card-body text-center">
        <h6>Nombre de ventes</h6>
        <h3 class="fw-bold text-primary" id="countSales">0</h3>
      </div>
    </div>
  </div>

  <div class="col-12 col-md-4">
    <div class="card border-warning">
      <div class="card-body text-center">
        <h6>TVA collectée</h6>
        <h3 class="fw-bold text-warning" id="totalTVA">0 $</h3>
      </div>
    </div>
  </div>

</div>

</div>

<script>

// ============================
// ENTREPRISE + USER
// ============================
const entrepriseId = localStorage.getItem("idEntreprise");
const user = localStorage.getItem("user") || "Inconnu";

// ============================
// CHARGER RAPPORT
// ============================
async function chargerRapport() {

  const dateDebut = document.getElementById("dateDebut").value;
  const dateFin = document.getElementById("dateFin").value;

  if (!dateDebut || !dateFin) {
    alert("Choisis les dates");
    return;
  }

  const res = await fetch(
    `${API}/api/rapport-ventes?idEntreprise=${entrepriseId}&dateDebut=${dateDebut}&dateFin=${dateFin}`
  );

  const data = await res.json();

  const total = data.total || 0;
  const count = data.count || 0;

  document.getElementById("totalSales").innerText = total.toFixed(2) + " $";
  document.getElementById("countSales").innerText = count;

  const tva = total * 0.16;
  document.getElementById("totalTVA").innerText = tva.toFixed(2) + " $";

  // ============================
  // INFOS PRINT
  // ============================
  document.getElementById("printEntreprise").innerText =
    "Entreprise: " + entrepriseId;

 // document.getElementById("printUser").innerText =
  //  "Caissier: " + user;

  document.getElementById("printDate").innerText =
    "Période: " + dateDebut + " → " + dateFin;
}

// ============================
// PRINT PRO
// ============================
function printRapport() {

  document.getElementById("printHeader").classList.remove("d-none");
  document.querySelector(".no-print").classList.add("d-none");

  window.print();

  setTimeout(() => {
    document.getElementById("printHeader").classList.add("d-none");
    document.querySelector(".no-print").classList.remove("d-none");
  }, 500);
}

</script>

</body>
</html>
