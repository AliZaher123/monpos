<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Login Admin SaaS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- GLOBAL CONFIG -->
<script src="globalconfig.js"></script>
</head>

<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">

  <div class="card shadow p-4" style="width: 360px;">

    <h4 class="text-center mb-3">🔐 Connexion Admin</h4>

    <input id="entrepriseId" class="form-control mb-2" placeholder="ID Entreprise">
    <input id="user" class="form-control mb-2" placeholder="Nom utilisateur">
    <input id="password" type="password" class="form-control mb-3" placeholder="Mot de passe">

    <button id="btnLogin" class="btn btn-primary w-100" onclick="login()">
      Se connecter
    </button>

    <div id="msg" class="mt-3 text-center"></div>

  </div>

</div>

<script>
async function login() {

  const btn = document.getElementById("btnLogin");
  const msg = document.getElementById("msg");

  const entrepriseId = document.getElementById("entrepriseId").value.trim();
  const user = document.getElementById("user").value.trim();
  const password = document.getElementById("password").value.trim();

  // Validation
  if (!entrepriseId || !user || !password) {
    msg.innerHTML =
      "<span class='text-danger'>Remplis tous les champs</span>";
    return;
  }

  try {
    // UI loading
    btn.disabled = true;
    btn.innerText = "Connexion...";
    msg.innerHTML = "";

    // Requête vers le backend
    const res = await fetch(`${API}/login-admin`, {
      method: "POST",
      credentials: "include", // IMPORTANT : permet de recevoir le cookie de session
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        entrepriseId,
        user,
        password
      })
    });

    const data = await res.json();

    // Erreur login
    if (!res.ok) {
      msg.innerHTML =
        `<span class="text-danger">${data.msg}</span>`;

      btn.disabled = false;
      btn.innerText = "Se connecter";
      return;
    }

    // ==========================
    // INFORMATIONS LOCALES (optionnel)
    // La vraie authentification repose sur la session serveur
    // ==========================
    localStorage.setItem("adminLogged", "true");
    localStorage.setItem("adminUser", data.user);
    localStorage.setItem("adminEntrepriseId", data.entrepriseId);
    localStorage.setItem("adminRole", data.role || "superadmin");

    // Succès
    msg.innerHTML =
      "<span class='text-success'>Connexion réussie ✔</span>";

    // Redirection
    setTimeout(() => {
      window.location.href = "Menu admin.html";
    }, 800);

  } catch (err) {
    console.error("Erreur login admin :", err);

    msg.innerHTML =
      "<span class='text-danger'>Erreur serveur</span>";

    btn.disabled = false;
    btn.innerText = "Se connecter";
  }
}

// Connexion avec la touche Entrée
document.addEventListener("keydown", function (e) {
  if (e.key === "Enter") {
    login();
  }
});
</script>

</body>
</html>
