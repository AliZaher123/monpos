<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Gestion Stock</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="globalconfig.js"></script>
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
  <a class="navbar-brand fw-bold" href="#">📦 GESTION STOCK</a>

  <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
    ☰
  </button>

  <div class="collapse navbar-collapse" id="menu">
    <div class="navbar-nav ms-auto">
      <a class="nav-link text-white" href="Menu.html">Retour →</a>
    </div>
  </div>
</nav>

<div class="container py-3 py-md-4">
<div class="row g-3">

<!-- FORM -->
<div class="col-12 col-md-4">
<div class="card p-3 shadow-sm">

<h5>Ajouter Produit / Service</h5>

<select id="type" class="form-select my-2" onchange="toggleStockFields()">
  <option value="Produit">Produit</option>
  <option value="Service">Service</option>
</select>

<input id="barcode" class="form-control my-2" placeholder="Code barre">
<input id="name" class="form-control my-2" placeholder="Nom">

<select id="category" class="form-select my-2"></select>

<input id="price" type="number" class="form-control my-2" placeholder="Prix (USD)">

<div id="qtyBox">
  <input id="qty" type="number" class="form-control my-2" placeholder="Quantité" min="0">
</div>

<select id="tva" class="form-select my-2"></select>

<button class="btn btn-primary w-100 mt-2" onclick="addProduct()">Ajouter</button>

<hr>

<h6>Recherche</h6>
<input id="search" class="form-control" placeholder="Nom / code / catégorie" onkeyup="render()">

</div>
</div>

<!-- TABLE -->
<div class="col-12 col-md-8">
<div class="card p-3 shadow-sm">

<div class="d-flex justify-content-end mb-2">
    <button class="btn btn-dark" onclick="printReport()">
        🖨 Imprimer rapport
    </button>
</div>


<div class="table-responsive">
<table class="table table-bordered table-sm">

<thead class="table-dark">
<tr>
<th>Produit</th>
<th>Code</th>
<th>Catégorie</th>
<th>Type</th>
<th>Prix</th>
<th>Qté initiale</th>
<th>Qté actuelle</th>
<th>TVA</th>
<th>TTC</th>
<th>Action</th>
</tr>
</thead>

<tbody id="stockTable"></tbody>

</table>
</div>

</div>
</div>

</div>
</div>

<script>

let stock = [];
let categories = [];

let idEntreprise = localStorage.getItem("idEntreprise");

if (!idEntreprise) {
    alert("Aucune entreprise détectée !");
    window.location.href = "Login.html";
}

// ========================
// TOGGLE
// ========================
function toggleStockFields() {
    const type = document.getElementById("type").value;
    document.getElementById("qtyBox").style.display =
        (type === "Service") ? "none" : "block";
}

// ========================
// LOAD CATEGORIES
// ========================
async function loadCategories() {
    let res = await fetch(`${API}/categorie?idEntreprise=` + idEntreprise);
    categories = await res.json();

    let select = document.getElementById("category");
    select.innerHTML = "";

    categories.forEach(cat => {
        select.innerHTML += `<option value="${cat.nom}">${cat.nom}</option>`;
    });
}

// ========================
// LOAD STOCK
// ========================
async function loadStock() {
    let res = await fetch(`${API}/stock?idEntreprise=` + idEntreprise);
    stock = await res.json();
    render();
}

// ========================
// ADD PRODUCT
// ========================
async function addProduct() {

    let name = document.getElementById("name").value;
    let barcode = document.getElementById("barcode").value;
    let category = document.getElementById("category").value;
    let price = parseFloat(document.getElementById("price").value);
    let qty = parseInt(document.getElementById("qty").value);
    let tva = parseFloat(document.getElementById("tva").value);
    let type = document.getElementById("type").value;

    if (!name || !barcode || isNaN(price)) return;

    if (type === "Service") qty = 0;

    await fetch(`${API}/stock`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            nom: name,
            codebarre: barcode,
            categorie: category,
            prix: price,
            quantite: qty,
            tva: tva,
            type: type,
            idEntreprise: idEntreprise
        })
    });

    clearForm();
    loadStock();
}

// ========================
// DELETE
// ========================
async function removeItem(id) {

    if (!confirm("Supprimer ?")) return;

    await fetch(`${API}/stock/` + id + "?idEntreprise=" + idEntreprise, {
        method: "DELETE"
    });

    loadStock();
}

// ========================
// UPDATE QUANTITE ACTUELLE
// ========================
async function updateQty(id, val) {

    await fetch(`${API}/stock/` + id + "?idEntreprise=" + idEntreprise, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ quantite: parseInt(val) })
    });

    loadStock();
}

// ========================
// UPDATE QUANTITE INITIALE
// ========================
async function updateQtyInitial(id, val) {

    await fetch(`${API}/stock/` + id + "?idEntreprise=" + idEntreprise, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ quantiteInitiale: parseInt(val) })
    });

    loadStock();
}

// ========================
// RENDER
// ========================
function render() {

    let search = document.getElementById("search").value.toLowerCase();
    let tbody = document.getElementById("stockTable");

    tbody.innerHTML = "";

    stock
    .filter(p =>
        (p.nom || "").toLowerCase().includes(search) ||
        (p.codebarre || "").includes(search) ||
        (p.categorie || "").toLowerCase().includes(search)
    )
    .forEach(p => {

        let isService = p.type === "Service";

        let qtyInitial = p.quantiteInitiale || 0;
        let qty = isService ? "-" : Number(p.quantite) || 0;

        let price = Number(p.prix) || 0;
        let tva = Number(p.tva) || 0;

        let priceTTC = price + (price * tva / 100);
        let totalTTC = isService ? priceTTC : priceTTC * qty;

        tbody.innerHTML += `
        <tr>
            <td>${p.nom}</td>
            <td>${p.codebarre}</td>
            <td>${p.categorie}</td>
            <td>${p.type}</td>

            <td class="text-primary fw-bold">
                ${priceTTC.toFixed(2)} $
            </td>

            <td>
            ${
                isService
                ? "-"
                : `<input type="number"
                    min="0"
                    value="${qtyInitial}"
                    class="form-control form-control-sm"
                    onchange="updateQtyInitial('${p._id}', this.value)">`
            }
            </td>

            <td>
            ${
                isService
                ? "-"
                : `<input type="number"
                    min="0"
                    value="${qty}"
                    class="form-control form-control-sm"
                    onchange="updateQty('${p._id}', this.value)">`
            }
            </td>

            <td>${tva}%</td>

            <td class="text-success fw-bold">
                ${totalTTC.toFixed(2)} $
            </td>

            <td>
                <button class="btn btn-danger btn-sm w-100"
                onclick="removeItem('${p._id}')">
                    Supprimer
                </button>
            </td>
        </tr>
        `;
    });
}

// ========================
// CLEAR FORM
// ========================
function clearForm() {
    document.getElementById("name").value = "";
    document.getElementById("barcode").value = "";
    document.getElementById("price").value = "";
    document.getElementById("qty").value = "";
}

// INIT
loadCategories();
loadStock();
toggleStockFields();

// TVA
function chargerTva() {

  fetch(`${API}/tva?idEntreprise=` + idEntreprise)
    .then(res => res.json())
    .then(data => {

      const select = document.getElementById("tva");
      select.innerHTML = "";

      data.forEach(tva => {
        const option = document.createElement("option");
        option.value = tva.valeur;
        option.innerText = `TVA (${tva.valeur}%)`;
        select.appendChild(option);
      });

    });
}
chargerTva();




function printReport() {

    let date = new Date().toLocaleString();

    let printWindow = window.open("", "", "width=900,height=700");

    let table = document.getElementById("stockTable").outerHTML;

    printWindow.document.write(`
        <html>
        <head>
            <title>Rapport Stock</title>
            <style>
                body {
                    font-family: Arial;
                    padding: 20px;
                }

                h2 {
                    text-align: center;
                }

                .date {
                    text-align: center;
                    margin-bottom: 20px;
                    color: gray;
                }

                table {
                    width: 100%;
                    border-collapse: collapse;
                }

                table, th, td {
                    border: 1px solid black;
                }

                th, td {
                    padding: 8px;
                    text-align: center;
                }

                th {
                    background: #000;
                    color: #fff;
                }
            </style>
        </head>

        <body>

            <h2>📦 Rapport Stock - HELPSTORE</h2>
            <div class="date">Date: ${date}</div>

            <table>
                <thead>
                    ${document.querySelector("thead").outerHTML}
                </thead>
                <tbody>
                    ${table}
                </tbody>
            </table>

            <script>
                window.print();
                window.onafterprint = window.close;
            <\/script>

        </body>
        </html>
    `);

    printWindow.document.close();
}


















</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
