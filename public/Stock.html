<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Gestion Stock</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="globalconfig.js"></script>
</head>

<body class="bg-light" id="app" style="display:none;">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
  <a class="navbar-brand fw-bold" href="#">📦 GESTION STOCK</a>

  <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
    ☰
  </button>

  <div class="collapse navbar-collapse" id="menu">
    <div class="navbar-nav ms-auto">
      <a class="nav-link text-white" href="Menu.html">Retour →</a>
    </div>
  </div>
</nav>

<div class="container py-3 py-md-4">
<div class="row g-3">

<!-- FORM -->
<div class="col-12 col-md-4">
<div class="card p-3 shadow-sm">

<h5>Ajouter Produit / Service</h5>

<select id="type" class="form-select my-2" onchange="toggleStockFields()">
  <option value="Produit">Produit</option>
  <option value="Service">Service</option>
</select>

<input id="barcode" class="form-control my-2" placeholder="Code barre">
<input id="name" class="form-control my-2" placeholder="Nom">

<select id="category" class="form-select my-2"></select>

<input id="price" type="number" class="form-control my-2" placeholder="Prix (USD)">

<div id="qtyBox">
  <input id="qty" type="number" class="form-control my-2" placeholder="Quantité" min="0">
</div>

<select id="tva" class="form-select my-2"></select>

<button class="btn btn-primary w-100 mt-2" onclick="addProduct()">➕ Ajouter</button>

<hr>

<h6>Recherche</h6>
<input id="search" class="form-control" placeholder="Nom / code / catégorie" onkeyup="render()">

</div>
</div>

<!-- TABLE -->
<div class="col-12 col-md-8">
<div class="card p-3 shadow-sm">
<div class="d-flex justify-content-end gap-2 mb-3">
    <button class="btn btn-success shadow-sm" onclick="exportExcel()">
        📊 Exporter Excel
    </button>

    <button class="btn btn-dark shadow-sm" onclick="printReport()">
        🖨 Imprimer rapport
    </button>
</div>


<div class="table-responsive">
<table class="table table-hover align-middle">
<thead class="table-dark">
<tr>
<th>Produit</th>
<th>Code</th>
<th>Catégorie</th>
<th>Type</th>
<th>Prix</th>
<th>Qté initiale</th>
<th>Qté actuelle</th>
<th>TVA</th>
<th>TTC</th>
<th>Action</th>
</tr>
</thead>

<tbody id="stockTable"></tbody>

</table>
</div>

</div>
</div>

</div>
</div>

<script>



// Vérification AVANT que la page ne s'affiche
if (typeof API === "undefined" || !API) {
  window.location.replace("Login.html");
} else {
  (async () => {
    try {
      const res = await fetch(`${API}/me`, {
        credentials: "include",
        cache: "no-store" // évite l'utilisation du cache du navigateur
      });

      // Si la session n'est pas valide
      if (!res.ok) {
        window.location.replace("Login.html");
        return;
      }

      const data = await res.json();

      // Aucun utilisateur connecté
      if (!data.user) {
        window.location.replace("Login.html");
        return;
      }

      // Autorisé → afficher la page
      document.getElementById("app").style.display = "block";

    } catch (err) {
      // En cas d'erreur réseau ou autre
      window.location.replace("Login.html");
    }
  })();
}













let stock = [];
let categories = [];

let idEntreprise = localStorage.getItem("idEntreprise");

if (!idEntreprise) {
    alert("Aucune entreprise détectée !");
    window.location.href = "Login.html";
}

// ========================
// TOGGLE
// ========================
function toggleStockFields() {
    const type = document.getElementById("type").value;
    document.getElementById("qtyBox").style.display =
        (type === "Service") ? "none" : "block";
}

// ========================
// LOAD CATEGORIES
// ========================
async function loadCategories() {
    let res = await fetch(`${API}/categorie?idEntreprise=` + idEntreprise);
    categories = await res.json();

    let select = document.getElementById("category");
    select.innerHTML = "";

    categories.forEach(cat => {
        select.innerHTML += `<option value="${cat.nom}">${cat.nom}</option>`;
    });
}

// ========================
// LOAD STOCK
// ========================
async function loadStock() {
    let res = await fetch(`${API}/stock?idEntreprise=` + idEntreprise);
    stock = await res.json();
    render();
}

// ========================
// ADD PRODUCT
// ========================
async function addProduct() {

    let name = document.getElementById("name").value;
    let barcode = document.getElementById("barcode").value;
    let category = document.getElementById("category").value;
    let price = parseFloat(document.getElementById("price").value);
    let qty = parseInt(document.getElementById("qty").value);
    let tva = parseFloat(document.getElementById("tva").value);
    let type = document.getElementById("type").value;

    if (!name || !barcode || isNaN(price)) return;

    if (type === "Service") qty = 0;

    await fetch(`${API}/stock`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            nom: name,
            codebarre: barcode,
            categorie: category,
            prix: price,
            quantite: qty,
            tva: tva,
            type: type,
            idEntreprise: idEntreprise
        })
    });

    clearForm();
    loadStock();
}

// ========================
// DELETE
// ========================
async function removeItem(id) {

    if (!confirm("Supprimer ?")) return;

    await fetch(`${API}/stock/` + id + "?idEntreprise=" + idEntreprise, {
        method: "DELETE"
    });

    loadStock();
}

// ========================
// UPDATE QUANTITE ACTUELLE
// ========================
async function updateQty(id, val) {

    await fetch(`${API}/stock/` + id + "?idEntreprise=" + idEntreprise, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ quantite: parseInt(val) })
    });

    loadStock();
}

// ========================
// UPDATE QUANTITE INITIALE
// ========================
async function updateQtyInitial(id, val) {

    await fetch(`${API}/stock/` + id + "?idEntreprise=" + idEntreprise, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ quantiteInitiale: parseInt(val) })
    });

    loadStock();
}

// ========================
// RENDER
// ========================
function render() {

    let search = document.getElementById("search").value.toLowerCase();
    let tbody = document.getElementById("stockTable");

    tbody.innerHTML = "";

    stock
    .filter(p =>
        (p.nom || "").toLowerCase().includes(search) ||
        (p.codebarre || "").includes(search) ||
        (p.categorie || "").toLowerCase().includes(search)
    )
    .forEach(p => {

        let isService = p.type === "Service";

        let qtyInitial = p.quantiteInitiale || 0;
        let qty = isService ? "-" : Number(p.quantite) || 0;

        let priceTTC = Number(p.prix) || 0;   // ⚠️ prix TTC
        let tva = Number(p.tva) || 0;

        // ✅ EXTRAIRE TVA
        let priceHT = priceTTC / (1 + tva / 100);
        let montantTVA = priceTTC - priceHT;

        let totalTTC = isService ? priceTTC : priceTTC * qty;

        tbody.innerHTML += `
        <tr>
            <td class="text-break" style="max-width:120px;">
                ${p.nom}
            </td>
            <td style="width:80px; font-family: monospace; font-size:11px; line-height:1.1;">
            ${p.codebarre ? p.codebarre.match(/.{1,6}/g).join('<br>') : ''}
            </td>
            <td>${p.categorie}</td>

            <td>
            ${
            p.type === "Produit"
            ? '<span class="badge bg-success">Produit</span>'
            : '<span class="badge bg-primary">Service</span>'
            }
            </td>

            <!-- PRIX TTC -->
            <td class="text-primary fw-bold">
                ${priceTTC.toFixed(2)} $
            </td>

            <!-- QTÉ INITIALE -->
            <td>
            ${
                isService
                ? "-"
                : `<input type="number"
                    min="0"
                    value="${qtyInitial}"
                    class="form-control form-control-sm"
                    onchange="updateQtyInitial('${p._id}', this.value)">`
            }
            </td>

            <!-- QTÉ ACTUELLE -->
            <td>
            ${
                isService
                ? "-"
                : `<input type="number"
                    min="0"
                    value="${qty}"
                    class="form-control form-control-sm"
                    onchange="updateQty('${p._id}', this.value)">`
            }
            </td>

            <!-- TVA % -->
            <td>${tva}% </td>

            <!-- TOTAL TTC -->
            <td class="text-success fw-bold">
                ${totalTTC.toFixed(2)} $
            </td>

            <td>
                <button class="btn btn-danger btn-sm w-100"
                onclick="removeItem('${p._id}')">
                    Supprimer
                </button>
            </td>
        </tr>
        `;
    });
}

// ========================
// CLEAR FORM
// ========================
function clearForm() {
    document.getElementById("name").value = "";
    document.getElementById("barcode").value = "";
    document.getElementById("price").value = "";
    document.getElementById("qty").value = "";
}

// INIT
loadCategories();
loadStock();
toggleStockFields();

// TVA
function chargerTva() {

  fetch(`${API}/tva?idEntreprise=` + idEntreprise)
    .then(res => res.json())
    .then(data => {

      const select = document.getElementById("tva");
      select.innerHTML = "";

      data.forEach(tva => {
        const option = document.createElement("option");
        option.value = tva.valeur;
        option.innerText = `TVA (${tva.valeur}%)`;
        select.appendChild(option);
      });

    });
}
chargerTva();




function printReport() {

    const date = new Date().toLocaleString();

    // Générer les lignes du tableau
    const rows = stock.map(p => {
        const isService = p.type === "Service";
        const qtyInitial = isService ? "-" : (Number(p.quantiteInitiale) || 0);
        const qty = isService ? "-" : (Number(p.quantite) || 0);
        const prix = Number(p.prix) || 0;
        const tva = Number(p.tva) || 0;
        const total = isService ? prix : prix * qty;

        return `
            <tr>
                <td>${p.nom || ""}</td>
                <td>${p.codebarre || ""}</td>
                <td>${p.categorie || ""}</td>
                <td>${p.type || ""}</td>
                <td>${prix.toFixed(2)} $</td>
                <td>${qtyInitial}</td>
                <td>${qty}</td>
                <td>${tva}%</td>
                <td>${total.toFixed(2)} $</td>
            </tr>
        `;
    }).join("");

    // Ouvrir fenêtre d'impression
    const w = window.open("", "", "width=1000,height=800");

    // HTML + CSS minimal
    w.document.write(`
        <html>
        <head>
            <title>Rapport Stock</title>
            <style>
                body { font-family: Arial; margin: 25px; }
                h1, p { text-align: center; margin: 5px; }
                .info { margin: 20px 0; font-size: 14px; }
                table { width: 100%; border-collapse: collapse; font-size: 12px; }
                th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
                th { background: #212529; color: white; }
                tr:nth-child(even) { background: #f8f9fa; }
                .footer {
                    margin-top: 20px;
                    text-align: center;
                    font-size: 11px;
                    color: #666;
                }
            </style>
        </head>
        <body>

            <h1>📦 HELPSTORE POS</h1>
            <p>Rapport détaillé du stock</p>

            <div class="info">
                <strong>Entreprise :</strong> ${idEntreprise}<br>
                <strong>Date :</strong> ${date}<br>
                <strong>Total articles :</strong> ${stock.length}
            </div>

            <table>
                <tr>
                    <th>Produit</th>
                    <th>Code</th>
                    <th>Catégorie</th>
                    <th>Type</th>
                    <th>Prix TTC</th>
                    <th>Qté Initiale</th>
                    <th>Qté Actuelle</th>
                    <th>TVA</th>
                    <th>Total TTC</th>
                </tr>
                ${rows}
            </table>

            <div class="footer">
                Document généré automatiquement par HELPSTORE POS
            </div>

            <script>
                window.print();
                window.onafterprint = () => window.close();
            <\/script>

        </body>
        </html>
    `);

    w.document.close();
}



// ========================
// EXPORT EXCEL
// ========================
function exportExcel() {

    // Préparer les données
    const data = stock.map(p => {

        const isService = p.type === "Service";
        const qty = isService ? 0 : Number(p.quantite) || 0;
        const qtyInitial = isService ? 0 : Number(p.quantiteInitiale) || 0;
        const prix = Number(p.prix) || 0;
        const tva = Number(p.tva) || 0;
        const totalTTC = isService ? prix : prix * qty;

        return {
            "Produit": p.nom || "",
            "Code Barre": p.codebarre || "",
            "Catégorie": p.categorie || "",
            "Type": p.type || "",
            "Prix TTC ($)": prix,
            "Quantité Initiale": qtyInitial,
            "Quantité Actuelle": qty,
            "TVA (%)": tva,
            "Total TTC ($)": totalTTC
        };
    });

    // Créer workbook
    const wb = XLSX.utils.book_new();

    // Créer feuille
    const ws = XLSX.utils.json_to_sheet(data);

    // Ajouter feuille au workbook
    XLSX.utils.book_append_sheet(wb, ws, "Stock");

    // Nom du fichier avec date
    const date = new Date().toISOString().slice(0, 10);

    // Télécharger
    XLSX.writeFile(wb, `Stock_${idEntreprise}_${date}.xlsx`);
}














</script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
