<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>POS Entreprise</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="globalconfig.js"></script>
</head>

<body class="bg-light" id="app" style="display:none;">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
  <a class="navbar-brand fw-bold" href="#">🛒 HELPSTORE</a>

  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
    ☰
  </button>

  <div class="collapse navbar-collapse" id="menu">
    <div class="navbar-nav ms-auto">
      <a class="nav-link text-white" href="Menu admin.html">Menu</a>
    </div>

    <span id="currentUser" class="text-white ms-3"></span>
  </div>
</nav>

<div class="container py-4">

<div class="row g-3">

<!-- ENTREPRISE -->
<div class="col-md-6">
<div class="card p-3 shadow">

<h5 class="text-center">Créer entreprise</h5>

<input type="text" id="companyName" class="form-control mb-2" placeholder="Nom entreprise">

<select id="companyPlan" class="form-select mb-2">
<option value="free">Free (7 jours)</option>
<option value="basic">Basic (30 jours)</option>
<option value="pro">Pro (365 jours)</option>
</select>

<textarea id="companyNote" class="form-control mb-2"></textarea>

<button class="btn btn-primary w-100" onclick="createCompany()">Créer entreprise</button>

</div>
</div>

<!-- USER -->
<div class="col-md-6">
<div class="card p-3 shadow">

<h5 class="text-center">Ajouter utilisateur</h5>

<select id="companySelect" class="form-select mb-2"></select>

<input type="text" id="userName" class="form-control mb-2">
<input type="password" id="password" class="form-control mb-2">

<select id="role" class="form-select mb-2">
<option value="admin">Admin</option>
<option value="user">User</option>
</select>

<button class="btn btn-success w-100" onclick="addUser()">Ajouter utilisateur</button>

</div>
</div>

</div>

<!-- TABLE ENTREPRISE -->
<div class="card mt-4 p-3 shadow">
<h5 class="text-center">Entreprises</h5>
<table class="table table-bordered">
<thead class="table-dark">
<tr>
<th>ID</th><th>Entreprise</th><th>Plan</th><th>Durée</th><th>Expiration</th><th>Note</th><th>Action</th>
</tr>
</thead>
<tbody id="companyTable"></tbody>
</table>
</div>

<!-- TABLE USERS -->
<div class="card mt-4 p-3 shadow">
<h5 class="text-center">Utilisateurs</h5>
<table class="table table-bordered">
<thead class="table-dark">
<tr>
<th>Entreprise</th><th>User</th><th>Role</th><th>Password</th><th>Action</th>
</tr>
</thead>
<tbody id="userTable"></tbody>
</table>
</div>

</div>

<!-- ================= MODAL ================= -->
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content p-3">

      <h5>Modifier</h5>

      <input id="editName" class="form-control mb-2" placeholder="Nom">

<select id="editPlan" class="form-select mb-2 d-none">
  <option value="free">Free (7 jours)</option>
  <option value="basic">Basic (30 jours)</option>
  <option value="pro">Pro (365 jours)</option>
</select>

<textarea id="editNote"
          class="form-control mb-2 d-none"
          placeholder="Note entreprise"></textarea>






      <select id="editRole" class="form-select mb-2 d-none">
        <option value="admin">Admin</option>
        <option value="user">User</option>
      </select>

      <input id="editPassword"
       type="password"
       class="form-control mb-2 d-none"
       placeholder="Nouveau mot de passe">

      <button class="btn btn-success" id="saveBtn">Enregistrer</button>
      <button class="btn btn-secondary mt-2" data-bs-dismiss="modal">Annuler</button>

    </div>
  </div>
</div>

<script>


if (typeof API === "undefined" || !API) {
  window.location.replace("Login admin.html");
} else {

  (async () => {

    try {

      const res = await fetch(`${API}/me`, {
        credentials: "include",
        cache: "no-store"
      });

      if (!res.ok) {
        window.location.replace("Login admin.html");
        return;
      }

      const data = await res.json();

      if (!data.admin) {
        window.location.replace("Login admin.html");
        return;
      }

      document.getElementById("app").style.display = "block";

    } catch (err) {
      window.location.replace("Login admin.html");
    }

  })();

}




















let companies = [];
let editType = null;
let editId = null;
let editUsername = null;

let modal;

window.addEventListener("DOMContentLoaded", () => {
  modal = new bootstrap.Modal(document.getElementById("editModal"));
  loadCompanies();
});


// ================= LOAD
async function loadCompanies() {
  try {
    console.log("🚀 LOAD START");

    

    const res = await fetch(`${API}/entreprises`, {
  credentials: "include"
});

    console.log("📡 STATUS:", res.status);

    const data = await res.json();
    console.log("📦 DATA:", data);

    companies = data;

    console.log("➡ BEFORE SELECT");
    updateSelect();
    console.log("➡ AFTER SELECT");

    console.log("➡ BEFORE RENDER");
    render();
    console.log("➡ AFTER RENDER");

  } catch (err) {
    console.error("❌ LOAD ERROR:", err);
  }
}

// ================= CREATE COMPANY
async function createCompany() {

const name = document.getElementById("companyName").value.trim();
const plan = document.getElementById("companyPlan").value;
const note = document.getElementById("companyNote").value || "";

if (!name) return alert("Nom requis");

let duration = plan === "basic" ? 30 : plan === "pro" ? 365 : 7;

await fetch(`${API}/entreprises`, {
method: "POST",
headers: {"Content-Type":"application/json"},
body: JSON.stringify({
_id: generateId(name),
name, plan, duration, note
})
});

loadCompanies();
}

// ================= ADD USER
async function addUser() {

const companyId = document.getElementById("companySelect").value;
const user = document.getElementById("userName").value.trim();
const password = document.getElementById("password").value.trim();
const role = document.getElementById("role").value;

await fetch(`${API}/entreprises/${companyId}/user`, {
method: "POST",
headers: {"Content-Type":"application/json"},
body: JSON.stringify({ user, password, role })
});

loadCompanies();
}

// ================= DELETE
async function deleteCompany(id){
await fetch(`${API}/entreprises/${id}`, {method:"DELETE"});
loadCompanies();
}

async function deleteUser(id,user){
await fetch(`${API}/entreprises/${id}/user/${user}`, {method:"DELETE"});
loadCompanies();
}

// ================= EDIT COMPANY
function editCompany(id){
  const c = companies.find(x => x._id === id);

  editType = "company";
  editId = id;

  // Nom
  document.getElementById("editName").value = c.name || "";

  // Afficher Plan
  const plan = document.getElementById("editPlan");
  plan.classList.remove("d-none");
  plan.value = c.plan || "free";

  // Afficher Note
  const note = document.getElementById("editNote");
  note.classList.remove("d-none");
  note.value = c.note || "";

  // Cacher les champs utilisateur
  document.getElementById("editRole").classList.add("d-none");
  document.getElementById("editPassword").classList.add("d-none");
  document.getElementById("editPassword").value = "";

  modal.show();
}

// ================= EDIT USER
function editUser(id, user, role) {

  editType = "user";
  editId = id;
  editUsername = user;

  // Nom utilisateur
  document.getElementById("editName").value = user;

  // Cacher les champs entreprise
  document.getElementById("editPlan").classList.add("d-none");
  document.getElementById("editNote").classList.add("d-none");

  // Afficher rôle
  const r = document.getElementById("editRole");
  r.classList.remove("d-none");
  r.value = role;

  // Afficher mot de passe
  const p = document.getElementById("editPassword");
  p.classList.remove("d-none");
  p.value = "";

  modal.show();
}

// ================= SAVE EDIT
document.getElementById("saveBtn").addEventListener("click", async () => {

const value = document.getElementById("editName").value;

if (editType === "company") {

  const plan = document.getElementById("editPlan").value;
  const note = document.getElementById("editNote").value;

  let duration =
    plan === "basic" ? 30 :
    plan === "pro" ? 365 :
    7;

  await fetch(`${API}/entreprises/${editId}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      name: value,
      plan: plan,
      duration: duration,
      note: note
    })
  });

}

if (editType === "user") {

  const role = document.getElementById("editRole").value;
  const password = document.getElementById("editPassword").value.trim();

  await fetch(`${API}/entreprises/${editId}/user/${editUsername}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      user: value,
      role: role,
      password: password
    })
  });

}

modal.hide();
loadCompanies();
});

// ================= RENDER
function render() {

  const cT = document.getElementById("companyTable");
  const uT = document.getElementById("userTable");

  cT.innerHTML = "";
  uT.innerHTML = "";

  companies.forEach(c => {

    cT.innerHTML += `
      <tr>
        <td>${c._id || "-"}</td>
        <td>${c.name || "-"}</td>
        <td>${c.plan || "-"}</td>
        <td>${c.duration || "-"}</td>
        <td>${c.expireAt ? new Date(c.expireAt).toLocaleDateString() : "-"}</td>
        <td>${c.note || "-"}</td>
        <td>
          <button class="btn btn-warning btn-sm" onclick="editCompany('${c._id}')">Modifier</button>
          <button class="btn btn-danger btn-sm" onclick="deleteCompany('${c._id}')">Supprimer</button>
        </td>
      </tr>
    `;

    (c.users || []).forEach(u => {
      uT.innerHTML += `
        <tr>
          <td>${c.name || "-"}</td>
          <td>${u.user || "-"}</td>
          <td>${u.role || "-"}</td>
          <td>••••••</td>
          <td>
            <button class="btn btn-warning btn-sm" onclick="editUser('${c._id}','${u.user}','${u.role}')">Modifier</button>
            <button class="btn btn-danger btn-sm" onclick="deleteUser('${c._id}','${u.user}')">Supprimer</button>
          </td>
        </tr>
      `;
    });

  });
}

// ================= SELECT
function updateSelect(){
let s=document.getElementById("companySelect");
s.innerHTML="";
companies.forEach(c=>{
s.innerHTML+=`<option value="${c._id}">${c.name}</option>`;
});
}

// ================= ID
function generateId(name){
return name.split(" ").map(w=>w[0]).join("").toUpperCase()+"-"+Date.now().toString().slice(-5);
}


</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
