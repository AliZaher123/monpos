<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SaaS POS Entreprise</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- GLOBAL CONFIG -->
<script src="globalconfig.js"></script>
</head>

<body class="bg-light">

<!-- MENU RESPONSIVE -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">

  <a class="navbar-brand fw-bold" href="#">🛒 HELPSTORE</a>

  <!-- BOUTON MOBILE -->
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
    ☰
  </button>

  <div class="collapse navbar-collapse" id="menu">
    <div class="navbar-nav ms-auto">
      <a class="nav-link text-white" href="Menu admin.html">Menu</a>
    </div>
 <!-- 👇 ICI -->
  <span id="currentUser" class="text-white ms-3"></span>

  </div>

</nav>




<div class="container py-4">

<!-- ================= FORM ================= -->
<div class="row g-3">

<!-- ENTREPRISE -->
<div class="col-md-6">
<div class="card p-3 shadow">

<h5 class="text-center">Créer entreprise</h5>

<input type="text" id="companyName" class="form-control mb-2" placeholder="Nom entreprise">

<label>Plan</label>
<select id="companyPlan" class="form-select mb-2">
<option value="free">Free (7 jours)</option>
<option value="basic">Basic (30 jours)</option>
<option value="pro">Pro (365 jours)</option>
</select>

<textarea id="companyNote" class="form-control mb-2" placeholder="Note entreprise"></textarea>

<button class="btn btn-primary w-100" onclick="createCompany()">
Créer entreprise
</button>

</div>
</div>

<!-- USER -->
<div class="col-md-6">
<div class="card p-3 shadow">

<h5 class="text-center">Ajouter utilisateur</h5>

<select id="companySelect" class="form-select mb-2"></select>

<input type="text" id="userName" class="form-control mb-2" placeholder="Utilisateur">
<input type="password" id="password" class="form-control mb-2" placeholder="Mot de passe">

<select id="role" class="form-select mb-2">
<option value="admin">Admin</option>
<option value="user">User</option>
<option value="manager">Manager</option>
</select>

<button class="btn btn-success w-100" onclick="addUser()">
Ajouter utilisateur
</button>

</div>
</div>

</div>

<!-- ================= TABLE ENTREPRISE ================= -->
<div class="card mt-4 shadow p-3">

<h5 class="text-center">Entreprises</h5>

<table class="table table-bordered table-hover">
<thead class="table-dark">
<tr>
<th>ID</th>
<th>Entreprise</th>
<th>Plan</th>
<th>Durée</th>
<th>Expiration</th>
<th>Note</th>
<th>Action</th>
</tr>
</thead>

<tbody id="companyTable"></tbody>
</table>

</div>

<!-- ================= TABLE USERS ================= -->
<div class="card mt-4 shadow p-3">

<h5 class="text-center">Utilisateurs</h5>

<table class="table table-bordered table-hover">
<thead class="table-dark">
<tr>
<th>Entreprise</th>
<th>User</th>
<th>Role</th>
<th>Password</th>
<th>Action</th>
</tr>
</thead>

<tbody id="userTable"></tbody>
</table>

</div>

</div>

<script>

let companies = [];

// ================= LOAD
async function loadCompanies() {
const res = await fetch(`${API}/entreprises`);
companies = await res.json();

updateSelect();
render();
}

// ================= CREATE
async function createCompany() {

const name = document.getElementById("companyName").value.trim();
const plan = document.getElementById("companyPlan").value;
const note = document.getElementById("companyNote").value || "";

if (!name) return alert("Nom requis");

let duration = 7;
if (plan === "basic") duration = 30;
if (plan === "pro") duration = 365;

await fetch(`${API}/entreprises`, {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({
_id: generateId(name),
name,
plan,
duration,
note
})
});

loadCompanies();
}

// ================= ADD USER
async function addUser() {

const companyId = document.getElementById("companySelect").value;
const user = document.getElementById("userName").value.trim();
const password = document.getElementById("password").value.trim();
const role = document.getElementById("role").value;

if (!companyId || !user || !password)
return alert("Champs manquants");

await fetch(`${API}/entreprises/${companyId}/user`, {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({ user, password, role })
});

loadCompanies();
}

// ================= DELETE COMPANY
async function deleteCompany(id) {
if (!confirm("Supprimer cette entreprise ?")) return;

await fetch(`${API}/entreprises/${id}`, {
method: "DELETE"
});

loadCompanies();
}

// ================= DELETE USER
async function deleteUser(companyId, username) {
if (!confirm("Supprimer cet utilisateur ?")) return;

await fetch(`${API}/entreprises/${companyId}/user/${username}`, {
method: "DELETE"
});

loadCompanies();
}

// ================= RENDER
function render() {

const companyTable = document.getElementById("companyTable");
const userTable = document.getElementById("userTable");

companyTable.innerHTML = "";
userTable.innerHTML = "";

companies.forEach(c => {

// ENTREPRISE
companyTable.innerHTML += `
<tr>
<td>${c._id}</td>
<td>${c.name}</td>
<td>${c.plan ?? "-"}</td>
<td>${c.duration ?? "-"}</td>
<td>${c.expireAt ? new Date(c.expireAt).toLocaleDateString() : "-"}</td>
<td>${c.note ?? "-"}</td>
<td>
<button class="btn btn-danger btn-sm" onclick="deleteCompany('${c._id}')">
Supprimer
</button>
</td>
</tr>
`;

// USERS
(c.users || []).forEach(u => {

userTable.innerHTML += `
<tr>
<td>${c.name}</td>
<td>${u.user}</td>
<td>${u.role}</td>
<td><span class="text-muted">••••••••</span></td>
<td>
<button class="btn btn-danger btn-sm"
onclick="deleteUser('${c._id}','${u.user}')">
Supprimer
</button>
</td>
</tr>
`;

});

});
}

// ================= SELECT
function updateSelect() {
const select = document.getElementById("companySelect");
select.innerHTML = "";

companies.forEach(c => {
select.innerHTML += `<option value="${c._id}">${c.name}</option>`;
});
}

// ================= ID GENERATOR
function generateId(name) {
return name.split(" ")
.map(w => w[0])
.join("")
.toUpperCase() + "-" + Date.now().toString().slice(-5);
}

// ================= INIT
loadCompanies();

</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
