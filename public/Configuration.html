<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Configuration POS</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- HEADER -->
<nav class="navbar navbar-dark bg-dark px-3">
  <span class="navbar-brand fw-bold">⚙️ POS CONFIGURATION</span>
        <a class="nav-link text-white" href="Menu.html">Retour →</a>

</nav>

<div class="container py-4">

<!-- TITRE -->
<div class="text-center mb-4">
  <h3>Tableau de configuration</h3>
  <p class="text-muted">Gérez votre système POS facilement</p>
</div>

<!-- MENU CARDS -->
<div class="row g-3">



<!-- CATEGORIES -->
<div class="col-6 col-md-3">
  <div class="card shadow-sm text-center p-3">
    <div class="fs-1">📁</div>
    <h6>Catégories</h6>
    <button class="btn btn-warning btn-sm w-100 mt-2" onclick="go('Categorie.html')">
      Ouvrir
    </button>
  </div>
</div>



<!-- USERS -->
<div class="col-6 col-md-3">
  <div class="card shadow-sm text-center p-3">
    <div class="fs-1">👤</div>
    <h6>Devise & TVA</h6>
    <button class="btn btn-dark btn-sm w-100 mt-2" onclick="go('Taux Devise et TVA.html')">
      Gérer
    </button>
  </div>
</div>


</div>

<!-- SETTINGS -->
<div class="card shadow-sm mt-4 p-3">

<h5>⚙️ Paramètres système</h5>

<div class="row">

<div class="col-12 col-md-4">
  <div class="form-check mt-2">
    <input class="form-check-input" type="checkbox" id="autoPrint">
    <label class="form-check-label">Impression automatique</label>
  </div>
</div>

<div class="col-12 col-md-4">
  <div class="form-check mt-2">
    <input class="form-check-input" type="checkbox" id="sound">
    <label class="form-check-label">Sons caisse</label>
  </div>
</div>

<div class="col-12 col-md-4">
  <div class="form-check mt-2">
    <input class="form-check-input" type="checkbox" id="darkMode">
    <label class="form-check-label">Mode sombre (beta)</label>
  </div>
</div>

</div>

<button class="btn btn-primary w-100 mt-3" onclick="saveSettings()">
💾 Sauvegarder
</button>

<p id="msg" class="text-center mt-2"></p>

</div>

</div>

<script>

// navigation
function go(page) {
    window.location.href = page;
}

// load settings
function loadSettings() {

    document.getElementById("autoPrint").checked =
        localStorage.getItem("autoPrint") === "true";

    document.getElementById("sound").checked =
        localStorage.getItem("sound") === "true";

    document.getElementById("darkMode").checked =
        localStorage.getItem("darkMode") === "true";
}

loadSettings();

// save settings
function saveSettings() {

    localStorage.setItem("autoPrint", document.getElementById("autoPrint").checked);
    localStorage.setItem("sound", document.getElementById("sound").checked);
    localStorage.setItem("darkMode", document.getElementById("darkMode").checked);

    let msg = document.getElementById("msg");
    msg.innerHTML = "✔ Paramètres enregistrés avec succès";
    msg.className = "text-success text-center";
}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
