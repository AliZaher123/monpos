<body class="bg-light" id="app" style="display:none;">

<!-- HEADER -->
<nav class="navbar navbar-dark bg-dark px-3">
  <span class="navbar-brand fw-bold">⚙️ POS CONFIGURATION</span>
        <a class="btn btn-light btn-sm" href="Menu.html">
          ← Retour

</nav>

<div class="container py-4">

<!-- TITRE -->
<div class="text-center mb-4">
  <h3>Tableau de configuration</h3>
  <p class="text-muted">Gérez votre système POS facilement</p>
</div>

<!-- MENU CARDS -->
<div class="row row-cols-2 row-cols-md-2 g-3">

  <!-- CATEGORIES -->
  <div class="col">
    <div class="card shadow-sm text-center p-3 h-100">
      <div class="fs-1">📁</div>
      <h6>Catégories</h6>
      <button class="btn btn-warning btn-sm w-100 mt-2" onclick="go('categorie.html')">
        Ouvrir
      </button>
    </div>
  </div>

  <!-- TVA & DEVISE -->
  <div class="col">
    <div class="card shadow-sm text-center p-3 h-100">
      <div class="fs-1">💱</div>
      <h6>Devise & TVA</h6>
      <button class="btn btn-dark btn-sm w-100 mt-2" onclick="go('Taux Devise et TVA.html')">
        Gérer
      </button>
    </div>
  </div>

</div>

</div>

<script>

if (typeof API === "undefined" || !API) {
  window.location.replace("Login.html");
} else {
  (async () => {
    try {
      const res = await fetch(`${API}/me`, {
        credentials: "include",
        cache: "no-store"
      });

      if (!res.ok) {
        window.location.replace("Login.html");
        return;
      }

      const data = await res.json();

      if (!data.user) {
        window.location.replace("Login.html");
        return;
      }

      document.getElementById("app").style.display = "block";

    } catch (err) {
      window.location.replace("Login.html");
    }
  })();
}

// Navigation
function go(page) {
  window.location.href = page;
}

</script>
