<script>

if (typeof API === "undefined" || !API) {
  window.location.replace("Login.html");
} else {
  (async () => {
    try {
      const res = await fetch(`${API}/me`, {
        credentials: "include",
        cache: "no-store"
      });

      if (!res.ok) {
        window.location.replace("Login.html");
        return;
      }

      const data = await res.json();

      if (!data.user) {
        window.location.replace("Login.html");
        return;
      }

      document.getElementById("app").style.display = "block";

    } catch (err) {
      window.location.replace("Login.html");
    }
  })();
}

// Navigation
function go(page) {
  window.location.href = page;
}
